name: hermes-kali-mcp
services:
  kali-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      tags:
        - hermes/kali-mcp:0.2.0
    command:
      - kali-server-mcp
      - --ip
      - 127.0.0.1
      - --port
      - "5000"
    container_name: hermes-kali-mcp
    cap_drop:
      - all
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 100
    healthcheck:
      test:
        - CMD-SHELL
        - nc -z 127.0.0.1 5000 || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - hermes-kali-lab
    read_only: true
    restart: on-failure
    security_opt:
      - no-new-privileges
    tmpfs:
      - /run:size=64m,mode=0755
      - /tmp:size=512m,mode=1777
      - /root/.msf4:size=256m,mode=0700
      - /root/.john:size=64m,mode=0700
      - /data/tmp:size=256m,mode=1777
    volumes:
      - ./data/results:/data/results
      - ./data/cache:/data/cache

  kali-maintenance:
    profiles: [maintenance]
    build:
      context: .
      dockerfile: Dockerfile
    cap_drop:
      - all
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - hermes-kali-egress
    security_opt:
      - no-new-privileges
    tmpfs:
      - /run:size=64m,mode=0755
      - /tmp:size=512m,mode=1777
      - /root/.msf4:size=256m,mode=0700
      - /root/.john:size=64m,mode=0700
      - /data/tmp:size=256m,mode=1777
    volumes:
      - ./data/results:/data/results
      - ./data/cache:/data/cache

networks:
  hermes-kali-lab:
    driver: bridge
    internal: true
    name: hermes-kali-mcp_hermes-kali-lab

  hermes-kali-egress:
    driver: bridge
    internal: false
    name: hermes-kali-mcp_hermes-kali-egress
