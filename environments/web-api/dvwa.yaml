description: PHP/MySQL web app with trivial to hard vulnerabilities for training and
  skill proof.
runtime: docker
driver: docker-compose
risk: low
source: dvwa
version: '1.10'
resources:
  cpu: '0.5'
  memory: 512Mi
  disk: 5Gi
networks:
- labnet-web
egress: false
targets:
