summary: Close the WebGoat lifecycle publication-readiness race. start.sh and reset.sh waited only for the webgoat application healthcheck, so reset invoked smoke.sh while webgoat-proxy was still starting and smoke failed closed. Both entrypoints now gate on the same two-service invariant (webgoat AND webgoat-proxy healthy) through a bounded fail-closed helper. Compose healthchecks, env port overrides and existing diagnostics are unchanged; runtime validation pending a live rerun.
source:
