  campaign: null
  observation: null
  reference: 'Live WebGoat run at main a91a325ed4ee1c66a17ab5d79a073b5f980fabbf: start, readiness and smoke PASS; `reset --yes` recreated services, waited only for the webgoat health gate and called smoke while webgoat-proxy health was still `starting` (proxy start_period 60s), producing `[smoke] Publication container not healthy: starting`; cleanup destroy proved zero residue. start.sh carried the same single-service wait but hid the defect because no smoke follows it.'
