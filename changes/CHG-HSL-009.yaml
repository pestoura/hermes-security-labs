summary: Implement the missing Hermes-side TB1 authorization receipt issuance boundary without placing private-key material or a private-key loader in the Labs repository. The boundary binds the exact admitted effect, derives canonical parameter and target digests plus authorization_ref, enforces a bounded receipt lifetime, and delegates signing to a purpose-bound external signer suitable for HSM, KMS or Vault integration. Repository implementation does not configure a signer, trust store or runtime authority.
