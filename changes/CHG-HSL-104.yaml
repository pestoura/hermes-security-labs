summary: 'Replace the ad-hoc Secret Zero Vault CLI container with a dedicated ephemeral non-root consumer image that inherits no Vault data/log volumes, uses its own isolated namespace on the shared security plane, mounts only the public CA read-only and preserves the operator-only HITL boundary.'
