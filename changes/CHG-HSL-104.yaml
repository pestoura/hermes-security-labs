  reference: 'Post-CHG-HSL-103 inspection found the ad-hoc Vault CLI consumer running as root with writable /vault/file and /vault/logs image volumes. The replacement was observed on HermesJarvas as UID/GID 10001, read-only, non-privileged, CAP_DROP=ALL, CA-only RO mount, no Vault data/log mounts, and IP 172.25.0.4 while the probe stayed 172.25.0.3. Future issuance binds to the consumer fresh /32, never the probe IP. No credential material was used.'
