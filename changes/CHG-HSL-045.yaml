summary: >-
  Add a repository-only, in-memory SO_PEERCRED authentication audit sink to the
  Unix peer authenticator, built on the merged AuditSink/evidence-chain
  (#369/#370). An optional injected AuthenticatorAuditSink records ALLOW/DENY
  decisions for the ENABLED transport only; a DISABLED policy fails closed with
  no authorization-admission audit. Identity stays exclusively kernel-derived
  from SO_PEERCRED with no caller-injectable principal/uid/gid path. New
  repo-only socketpair/in-memory-policy tests cover authorized, unauthorized,
  disabled, caller-supplied bypass impossible and AuditSink tamper integrity.
  No runtime/systemd/network/Docker/target/trust/provider state changed;
  transport-policy.yaml and routing-policy.yaml untouched. Campaign stays
  BLOCKED/HOLD, promotion_allowed false.
