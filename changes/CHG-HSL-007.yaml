summary: Align the WebGoat smoke script with compose publication ownership. Host ports are published only by webgoat-proxy, so `docker compose port webgoat` never resolved a mapping and live smoke failed closed at port resolution. smoke.sh keeps SERVICE_NAME=webgoat for the workload health gate and pinned digest check, and adds PUBLISH_SERVICE_NAME=webgoat-proxy for port lookups plus a publication presence/health assertion. Binding, HTTP, digest and network checks unchanged; no target or offensive behaviour added.
