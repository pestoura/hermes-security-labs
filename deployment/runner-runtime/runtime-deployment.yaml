# Runner runtime deployment boundary — repository-only (#354, phase A).
#
# This descriptor declares the *base HOLD boundary*. It is NOT live deployment
# state and never creates users, groups, sockets, services or trust stores.
# All policies are DISABLED / default-deny / NOT_RUN / execution_authority=none
# / promotion_allowed=false. No target effect (WebGoat/Kali) is possible.
#
# Trust binding (phase B) is deliberately absent: no
# /etc/hexor/runner/authorization-trust-store.json is created or installed by
# this descriptor, and the committed example descriptor is never treated as live.
schema_version: "1.0"
descriptor_id: hexor.runner.runtime-deployment.hold-boundary
issue: 354
phase: base-hold-deployment
runtime_status: NOT_RUN
promotion_allowed: false

# Declared OS identities mirror the canonical example descriptor
# (runner-identity-descriptor.example.yaml): hexor-gateway 4100,
# hexor-runner 4101, hexor-dispatch 4110. They are declared only; nothing here
# provisions them.
identities:
  gateway:
    principal_id: hexor.execution-gateway
    user: hexor-gateway
    uid: 4100
    gid: 4100
    shell: /usr/sbin/nologin
  runner:
    principal_id: hexor.runner
    user: hexor-runner
    uid: 4101
    gid: 4101
    shell: /usr/sbin/nologin
  dispatch_group:
    group: hexor-dispatch
    gid: 4110
    members:
      - hexor-gateway
      - hexor-runner

# Runtime directory + AF_UNIX dispatch socket (HOLD surface).
socket:
  path: /run/hexor/runner-dispatch.sock
  owner_uid: 4101
  group_gid: 4110
  mode: "0660"
  directory:
    path: /run/hexor
    owner_uid: 4101
    group_gid: 4110
    mode: "0750"

# Fail-closed policy envelope for the base boundary.
policy:
  state: DISABLED
  default: deny
  runtime_status: NOT_RUN
  execution_authority: none
  promotion_allowed: false

# Listener behavior: HOLD only. The listener may obtain SO_PEERCRED from the
# accepted peer via the canonical unix_peer_identity module and close/refuse,
# but performs no downstream work.
listener:
  mode: HOLD
  transport: unix-peer
  identity_source: linux-so-peercred
  socket_activation: systemd
  refuse_on_any:
    - read_request_payload
    - authorize_execution
    - create_receipt
    - call_router
    - call_adapter
    - touch_evidence_plane
    - touch_target
    - enable_trust_store

# Phase B trust binding: absent by default. Only an explicit external source with
# a public trust store and an expected SHA-256 is ever accepted.
trust_binding:
  enabled: false
  source: null
  public_source: false
  expected_sha256: null
  trust_store_path: /etc/hexor/runner/authorization-trust-store.json

# Explicitly no target effects.
target_effects:
  webgoat: none
  kali: none
