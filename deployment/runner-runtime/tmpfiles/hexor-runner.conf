# tmpfiles.d declaration for the Hexor Runner runtime directory (HOLD boundary).
#
# Creates /run/hexor owned by hexor-runner (4101) and group hexor-dispatch (4110)
# with mode 0750. The socket itself is created by systemd socket activation
# (hexor-runner.socket), not by tmpfiles, so it inherits the correct ownership
# and 0660 mode. Nothing here provisions the identities; the UIDs/GIDs are
# declared and must pre-exist on the host (collision preflight fail-closed).
#
# Format: Type Path Mode UID GID Age Argument
d /run/hexor 0750 4101 4110 - -
