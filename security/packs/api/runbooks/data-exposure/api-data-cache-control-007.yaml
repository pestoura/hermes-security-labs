apiVersion: hex0r.io/v1alpha1
kind: ApiPentestRunbook
metadata:
  id: API-DATA-CACHE-CONTROL-007
  name: Validate cache controls on sensitive responses
  version: 0.1.0
  status: experimental
  category: data-exposure
  tags:
  - api
  - data-exposure
  - headers
  - sensitive-cache-control
mapping:
  owasp_api:
  - API3:2023
  cwe:
  - CWE-525
selectors:
  api_types:
  - rest
  auth_types:
  - any
  required_capabilities: []
risk:
  intrusiveness: passive
  production_safe: true
  destructive: false
  max_requests: 10
  max_response_bytes: 65536
inputs:
- name: base_url
  type: uri
  required: true
  secret: false
steps:
- id: primary-probe
  action: kali.action
  handler: headers
  profile: sensitive-cache-control
  arguments:
    url: '{{ target.base_url }}'
  timeout_seconds: 60
  evidence:
  - request_metadata
  - response_status
  - response_headers
  - redacted_response_sample
  - timestamps
evaluation:
  vulnerable_when:
  - profile-specific vulnerable signal is present
  secure_when:
  - profile-specific protection signal is present
  inconclusive_when:
  - target unavailable or prerequisites missing
outputs:
  title: Validate cache controls on sensitive responses
  severity: medium
  confidence: dynamic
