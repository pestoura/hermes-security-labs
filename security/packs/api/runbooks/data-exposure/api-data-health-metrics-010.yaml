apiVersion: hex0r.io/v1alpha1
kind: ApiPentestRunbook
metadata:
  id: API-DATA-HEALTH-METRICS-010
  name: Assess information exposure through health and metrics endpoints
  version: 0.1.0
  status: experimental
  category: data-exposure
  tags:
  - api
  - data-exposure
  - fuzz
  - health-metrics-exposure
mapping:
  owasp_api:
  - API8:2023
  cwe:
  - CWE-200
selectors:
  api_types:
  - rest
  auth_types:
  - any
  required_capabilities: []
risk:
  intrusiveness: medium
  production_safe: false
  destructive: false
  max_requests: 100
  max_response_bytes: 65536
inputs:
- name: base_url
  type: uri
  required: true
  secret: false
steps:
- id: primary-probe
  action: kali.action
  handler: fuzz
  profile: health-metrics-exposure
  arguments:
    url: '{{ target.base_url }}'
  timeout_seconds: 180
  evidence:
  - request_metadata
  - response_status
  - response_headers
  - redacted_response_sample
  - timestamps
evaluation:
  vulnerable_when:
  - profile-specific vulnerable signal is present
  secure_when:
  - profile-specific protection signal is present
  inconclusive_when:
  - target unavailable or prerequisites missing
outputs:
  title: Assess information exposure through health and metrics endpoints
  severity: medium
  confidence: dynamic
