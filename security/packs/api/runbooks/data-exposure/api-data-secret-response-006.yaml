apiVersion: hex0r.io/v1alpha1
kind: ApiPentestRunbook
metadata:
  id: API-DATA-SECRET-RESPONSE-006
  name: Detect secrets and credentials in API responses
  version: 0.1.0
  status: experimental
  category: data-exposure
  tags:
  - api
  - data-exposure
  - nuclei
  - secret-response-exposure
mapping:
  owasp_api:
  - API3:2023
  cwe:
  - CWE-200
selectors:
  api_types:
  - rest
  auth_types:
  - any
  required_capabilities: []
risk:
  intrusiveness: high
  production_safe: false
  destructive: false
  max_requests: 200
  max_response_bytes: 65536
inputs:
- name: base_url
  type: uri
  required: true
  secret: false
steps:
- id: primary-probe
  action: kali.action
  handler: nuclei
  profile: secret-response-exposure
  arguments:
    url: '{{ target.base_url }}'
  timeout_seconds: 300
  evidence:
  - request_metadata
  - response_status
  - response_headers
  - redacted_response_sample
  - timestamps
evaluation:
  vulnerable_when:
  - response_contains_sensitive_data == true
  secure_when:
  - response_contains_sensitive_data == false
  inconclusive_when:
  - target_reachable == false or prerequisites_missing == true
outputs:
  title: Detect secrets and credentials in API responses
  severity: critical
  confidence: dynamic
