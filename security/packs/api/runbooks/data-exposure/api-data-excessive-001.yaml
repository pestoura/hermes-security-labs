apiVersion: hex0r.io/v1alpha1
kind: ApiPentestRunbook
metadata:
  id: API-DATA-EXCESSIVE-001
  name: Detect excessive data exposure in API responses
  version: 0.1.0
  status: experimental
  category: data-exposure
  tags:
  - api
  - data-exposure
  - http
  - excessive-data-exposure
mapping:
  owasp_api:
  - API3:2023
  cwe:
  - CWE-200
selectors:
  api_types:
  - rest
  auth_types:
  - any
  required_capabilities: []
risk:
  intrusiveness: low
  production_safe: true
  destructive: false
  max_requests: 20
  max_response_bytes: 65536
inputs:
- name: base_url
  type: uri
  required: true
  secret: false
steps:
- id: primary-probe
  action: kali.action
  handler: http
  profile: excessive-data-exposure
  arguments:
    url: '{{ target.base_url }}'
  timeout_seconds: 60
  evidence:
  - request_metadata
  - response_status
  - response_headers
  - redacted_response_sample
  - timestamps
evaluation:
  vulnerable_when:
  - http_status in {200,401,403,500} and 'x-powered-by' in response_headers
  secure_when:
  - http_status in {401,403} or 'x-powered-by' not in response_headers
  inconclusive_when:
  - target_reachable == false or prerequisites_missing == true
outputs:
  title: Detect excessive data exposure in API responses
  severity: high
  confidence: dynamic
