apiVersion: hex0r.io/v1alpha1
kind: ApiPentestRunbook
metadata:
  id: API-DATA-SENSITIVE-HEADERS-002
  name: Detect sensitive data in response headers
  version: 0.1.0
  status: experimental
  category: data-exposure
  tags:
  - api
  - data-exposure
  - headers
  - sensitive-response-headers
mapping:
  owasp_api:
  - API3:2023
  cwe:
  - CWE-200
selectors:
  api_types:
  - rest
  auth_types:
  - any
  required_capabilities: []
risk:
  intrusiveness: passive
  production_safe: true
  destructive: false
  max_requests: 10
  max_response_bytes: 65536
inputs:
- name: base_url
  type: uri
  required: true
  secret: false
steps:
- id: primary-probe
  action: kali.action
  handler: headers
  profile: sensitive-response-headers
  arguments:
    url: '{{ target.base_url }}'
  timeout_seconds: 60
  evidence:
  - request_metadata
  - response_status
  - response_headers
  - redacted_response_sample
  - timestamps
evaluation:
  vulnerable_when:
  - '''x-content-type-options'' not in response_headers or ''x-frame-options'' not
    in response_headers'
  secure_when:
  - '''x-content-type-options'' in response_headers and ''x-frame-options'' in response_headers'
  inconclusive_when:
  - target_reachable == false or prerequisites_missing == true
outputs:
  title: Detect sensitive data in response headers
  severity: high
  confidence: dynamic
