apiVersion: hex0r.io/v1alpha1
kind: ApiPentestRunbook
metadata:
  id: API-TOKEN-REFRESH-EXPOSURE-011
  name: Detect refresh token exposure outside intended channels
  version: 0.1.0
  status: experimental
  category: token-session
  tags:
  - api
  - token-session
  - http
  - refresh-token-exposure
mapping:
  owasp_api:
  - API2:2023
  cwe:
  - CWE-522
selectors:
  api_types:
  - rest
  auth_types:
  - any
  required_capabilities: []
risk:
  intrusiveness: medium
  production_safe: false
  destructive: false
  max_requests: 20
  max_response_bytes: 65536
inputs:
- name: base_url
  type: uri
  required: true
  secret: false
steps:
- id: primary-probe
  action: kali.action
  handler: http
  profile: refresh-token-exposure
  arguments:
    url: '{{ target.base_url }}'
  timeout_seconds: 60
  evidence:
  - request_metadata
  - response_status
  - response_headers
  - redacted_response_sample
  - timestamps
evaluation:
  vulnerable_when:
  - profile-specific vulnerable signal is present
  secure_when:
  - profile-specific protection signal is present
  inconclusive_when:
  - target unavailable or prerequisites missing
outputs:
  title: Detect refresh token exposure outside intended channels
  severity: high
  confidence: dynamic
