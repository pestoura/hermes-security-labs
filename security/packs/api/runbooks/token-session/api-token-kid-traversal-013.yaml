apiVersion: hex0r.io/v1alpha1
kind: ApiPentestRunbook
metadata:
  id: API-TOKEN-KID-TRAVERSAL-013
  name: Detect JWT kid path traversal handling
  version: 0.1.0
  status: experimental
  category: token-session
  tags:
  - api
  - token-session
  - jwt
  - jwt-kid-traversal
mapping:
  owasp_api:
  - API2:2023
  cwe:
  - CWE-22
selectors:
  api_types:
  - rest
  auth_types:
  - bearer
  - jwt
  - oauth2
  - oidc
  required_capabilities:
  - token_capture
risk:
  intrusiveness: medium
  production_safe: false
  destructive: false
  max_requests: 40
  max_response_bytes: 65536
inputs:
- name: base_url
  type: uri
  required: true
  secret: false
steps:
- id: primary-probe
  action: kali.action
  handler: jwt
  profile: jwt-kid-traversal
  arguments:
    url: '{{ target.base_url }}'
  timeout_seconds: 120
  evidence:
  - request_metadata
  - response_status
  - response_headers
  - redacted_response_sample
  - timestamps
evaluation:
  vulnerable_when:
  - jwt_signature_valid == false
  secure_when:
  - jwt_signature_valid == true
  inconclusive_when:
  - target_reachable == false or prerequisites_missing == true
outputs:
  title: Detect JWT kid path traversal handling
  severity: critical
  confidence: dynamic
