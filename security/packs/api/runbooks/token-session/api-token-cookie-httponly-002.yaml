apiVersion: hex0r.io/v1alpha1
kind: ApiPentestRunbook
metadata:
  id: API-TOKEN-COOKIE-HTTPONLY-002
  name: Validate HttpOnly flag on authentication cookies
  version: 0.1.0
  status: experimental
  category: token-session
  tags:
  - api
  - token-session
  - headers
  - cookie-httponly
mapping:
  owasp_api:
  - API2:2023
  cwe:
  - CWE-1004
selectors:
  api_types:
  - rest
  auth_types:
  - any
  required_capabilities: []
risk:
  intrusiveness: medium
  production_safe: false
  destructive: false
  max_requests: 20
  max_response_bytes: 65536
inputs:
- name: base_url
  type: uri
  required: true
  secret: false
steps:
- id: primary-probe
  action: kali.action
  handler: headers
  profile: cookie-httponly
  arguments:
    url: '{{ target.base_url }}'
  timeout_seconds: 60
  evidence:
  - request_metadata
  - response_status
  - response_headers
  - redacted_response_sample
  - timestamps
evaluation:
  vulnerable_when:
  - '''secure'' not in response_headers and ''httponly'' not in response_headers'
  secure_when:
  - '''secure'' in response_headers and ''httponly'' in response_headers'
  inconclusive_when:
  - target_reachable == false or prerequisites_missing == true
outputs:
  title: Validate HttpOnly flag on authentication cookies
  severity: medium
  confidence: dynamic
