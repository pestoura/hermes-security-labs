apiVersion: hex0r.io/v1alpha1
kind: ApiPentestRunbook
metadata:
  id: API-TOKEN-SESSION-FIXATION-004
  name: Detect session fixation through authentication transitions
  version: 0.1.0
  status: experimental
  category: token-session
  tags:
  - api
  - token-session
  - workflow
  - session-fixation
mapping:
  owasp_api:
  - API2:2023
  cwe:
  - CWE-384
selectors:
  api_types:
  - rest
  auth_types:
  - any
  required_capabilities: []
risk:
  intrusiveness: medium
  production_safe: false
  destructive: false
  max_requests: 40
  max_response_bytes: 65536
inputs:
- name: base_url
  type: uri
  required: true
  secret: false
steps:
- id: primary-probe
  action: kali.action
  handler: workflow
  profile: session-fixation
  arguments:
    url: '{{ target.base_url }}'
  timeout_seconds: 120
  evidence:
  - request_metadata
  - response_status
  - response_headers
  - redacted_response_sample
  - timestamps
evaluation:
  vulnerable_when:
  - workflow_status in {'failed','blocked'}
  secure_when:
  - workflow_status in {'passed','completed'}
  inconclusive_when:
  - target_reachable == false or prerequisites_missing == true
outputs:
  title: Detect session fixation through authentication transitions
  severity: high
  confidence: dynamic
