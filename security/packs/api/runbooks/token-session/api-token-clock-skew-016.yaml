apiVersion: hex0r.io/v1alpha1
kind: ApiPentestRunbook
metadata:
  id: API-TOKEN-CLOCK-SKEW-016
  name: Validate nbf and exp clock-skew boundaries
  version: 0.1.0
  status: experimental
  category: token-session
  tags:
  - api
  - token-session
  - jwt
  - jwt-clock-skew
mapping:
  owasp_api:
  - API2:2023
  cwe:
  - CWE-613
selectors:
  api_types:
  - rest
  auth_types:
  - bearer
  - jwt
  - oauth2
  - oidc
  required_capabilities:
  - token_capture
risk:
  intrusiveness: medium
  production_safe: false
  destructive: false
  max_requests: 40
  max_response_bytes: 65536
inputs:
- name: base_url
  type: uri
  required: true
  secret: false
steps:
- id: primary-probe
  action: kali.action
  handler: jwt
  profile: jwt-clock-skew
  arguments:
    url: '{{ target.base_url }}'
  timeout_seconds: 120
  evidence:
  - request_metadata
  - response_status
  - response_headers
  - redacted_response_sample
  - timestamps
evaluation:
  vulnerable_when:
  - profile-specific vulnerable signal is present
  secure_when:
  - profile-specific protection signal is present
  inconclusive_when:
  - target unavailable or prerequisites missing
outputs:
  title: Validate nbf and exp clock-skew boundaries
  severity: medium
  confidence: dynamic
