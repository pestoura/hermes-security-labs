apiVersion: hex0r.io/v1alpha1
kind: ApiPentestRunbook
metadata:
  id: API-RATE-RESET-003
  name: Validate password reset request rate limiting
  version: 0.1.0
  status: experimental
  category: rate-resource
  tags:
  - api
  - rate-resource
  - race
  - password-reset-rate-limit
mapping:
  owasp_api:
  - API2:2023
  cwe:
  - CWE-799
selectors:
  api_types:
  - rest
  auth_types:
  - any
  required_capabilities: []
risk:
  intrusiveness: high
  production_safe: false
  destructive: false
  max_requests: 100
  max_response_bytes: 65536
inputs:
- name: base_url
  type: uri
  required: true
  secret: false
steps:
- id: primary-probe
  action: kali.action
  handler: race
  profile: password-reset-rate-limit
  arguments:
    url: '{{ target.base_url }}'
  timeout_seconds: 180
  evidence:
  - request_metadata
  - response_status
  - response_headers
  - redacted_response_sample
  - timestamps
evaluation:
  vulnerable_when:
  - rate_limit_triggered == false and response_status == 200
  secure_when:
  - rate_limit_triggered == true
  inconclusive_when:
  - target_reachable == false or prerequisites_missing == true
outputs:
  title: Validate password reset request rate limiting
  severity: medium
  confidence: dynamic
