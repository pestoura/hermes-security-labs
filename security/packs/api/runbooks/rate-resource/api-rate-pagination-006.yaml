apiVersion: hex0r.io/v1alpha1
kind: ApiPentestRunbook
metadata:
  id: API-RATE-PAGINATION-006
  name: Validate maximum pagination limits
  version: 0.1.0
  status: experimental
  category: rate-resource
  tags:
  - api
  - rate-resource
  - http
  - pagination-upper-bound
mapping:
  owasp_api:
  - API4:2023
  cwe:
  - CWE-770
selectors:
  api_types:
  - rest
  auth_types:
  - any
  required_capabilities: []
risk:
  intrusiveness: high
  production_safe: false
  destructive: false
  max_requests: 20
  max_response_bytes: 65536
inputs:
- name: base_url
  type: uri
  required: true
  secret: false
steps:
- id: primary-probe
  action: kali.action
  handler: http
  profile: pagination-upper-bound
  arguments:
    url: '{{ target.base_url }}'
  timeout_seconds: 60
  evidence:
  - request_metadata
  - response_status
  - response_headers
  - redacted_response_sample
  - timestamps
evaluation:
  vulnerable_when:
  - rate_limit.triggered == false and response_status == 200
  secure_when:
  - rate_limit.triggered == true
  inconclusive_when:
  - target_reachable == false or prerequisites_missing == true
outputs:
  title: Validate maximum pagination limits
  severity: medium
  confidence: dynamic
