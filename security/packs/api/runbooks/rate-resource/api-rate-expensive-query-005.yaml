apiVersion: hex0r.io/v1alpha1
kind: ApiPentestRunbook
metadata:
  id: API-RATE-EXPENSIVE-QUERY-005
  name: Detect unbounded expensive query execution
  version: 0.1.0
  status: experimental
  category: rate-resource
  tags:
  - api
  - rate-resource
  - race
  - expensive-query-bounded
mapping:
  owasp_api:
  - API4:2023
  cwe:
  - CWE-400
selectors:
  api_types:
  - rest
  auth_types:
  - any
  required_capabilities: []
risk:
  intrusiveness: high
  production_safe: false
  destructive: false
  max_requests: 100
  max_response_bytes: 65536
inputs:
- name: base_url
  type: uri
  required: true
  secret: false
steps:
- id: primary-probe
  action: kali.action
  handler: race
  profile: expensive-query-bounded
  arguments:
    url: '{{ target.base_url }}'
  timeout_seconds: 180
  evidence:
  - request_metadata
  - response_status
  - response_headers
  - redacted_response_sample
  - timestamps
evaluation:
  vulnerable_when:
  - profile-specific vulnerable signal is present
  secure_when:
  - profile-specific protection signal is present
  inconclusive_when:
  - target unavailable or prerequisites missing
outputs:
  title: Detect unbounded expensive query execution
  severity: high
  confidence: dynamic
