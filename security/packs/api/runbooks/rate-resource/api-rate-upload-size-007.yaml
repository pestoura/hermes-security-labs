apiVersion: hex0r.io/v1alpha1
kind: ApiPentestRunbook
metadata:
  id: API-RATE-UPLOAD-SIZE-007
  name: Validate file upload size limits
  version: 0.1.0
  status: experimental
  category: rate-resource
  tags:
  - api
  - rate-resource
  - workflow
  - upload-size-limit
mapping:
  owasp_api:
  - API4:2023
  cwe:
  - CWE-770
selectors:
  api_types:
  - rest
  auth_types:
  - any
  required_capabilities:
  - file_upload
risk:
  intrusiveness: high
  production_safe: false
  destructive: false
  max_requests: 40
  max_response_bytes: 65536
inputs:
- name: base_url
  type: uri
  required: true
  secret: false
steps:
- id: primary-probe
  action: kali.action
  handler: workflow
  profile: upload-size-limit
  arguments:
    url: '{{ target.base_url }}'
  timeout_seconds: 120
  evidence:
  - request_metadata
  - response_status
  - response_headers
  - redacted_response_sample
  - timestamps
evaluation:
  vulnerable_when:
  - handler_signal in {'failed','blocked'}
  secure_when:
  - handler_signal in {'secure','hardened','passed'}
  inconclusive_when:
  - target_reachable == false or prerequisites_missing == true
outputs:
  title: Validate file upload size limits
  severity: high
  confidence: dynamic
