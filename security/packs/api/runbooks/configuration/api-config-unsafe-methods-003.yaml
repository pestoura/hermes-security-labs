apiVersion: hex0r.io/v1alpha1
kind: ApiPentestRunbook
metadata:
  id: API-CONFIG-UNSAFE-METHODS-003
  name: Detect unnecessary or unsafe HTTP methods
  version: 0.1.0
  status: experimental
  category: configuration
  tags:
  - api
  - configuration
  - http
  - unsafe-http-methods
mapping:
  owasp_api:
  - API8:2023
  cwe:
  - CWE-749
selectors:
  api_types:
  - rest
  auth_types:
  - any
  required_capabilities: []
risk:
  intrusiveness: low
  production_safe: true
  destructive: false
  max_requests: 20
  max_response_bytes: 65536
inputs:
- name: base_url
  type: uri
  required: true
  secret: false
steps:
- id: primary-probe
  action: kali.action
  handler: http
  profile: unsafe-http-methods
  arguments:
    url: '{{ target.base_url }}'
  timeout_seconds: 60
  evidence:
  - request_metadata
  - response_status
  - response_headers
  - redacted_response_sample
  - timestamps
evaluation:
  vulnerable_when:
  - profile-specific vulnerable signal is present
  secure_when:
  - profile-specific protection signal is present
  inconclusive_when:
  - target unavailable or prerequisites missing
outputs:
  title: Detect unnecessary or unsafe HTTP methods
  severity: medium
  confidence: dynamic
