apiVersion: hex0r.io/v1alpha1
kind: ApiPentestRunbook
metadata:
  id: API-CONFIG-DEBUG-MODE-008
  name: Detect API debug mode exposure
  version: 0.1.0
  status: experimental
  category: configuration
  tags:
  - api
  - configuration
  - nuclei
  - debug-mode
mapping:
  owasp_api:
  - API8:2023
  cwe:
  - CWE-489
selectors:
  api_types:
  - rest
  auth_types:
  - any
  required_capabilities: []
risk:
  intrusiveness: high
  production_safe: false
  destructive: false
  max_requests: 200
  max_response_bytes: 65536
inputs:
- name: base_url
  type: uri
  required: true
  secret: false
steps:
- id: primary-probe
  action: kali.action
  handler: nuclei
  profile: debug-mode
  arguments:
    url: '{{ target.base_url }}'
  timeout_seconds: 300
  evidence:
  - request_metadata
  - response_status
  - response_headers
  - redacted_response_sample
  - timestamps
evaluation:
  vulnerable_when:
  - profile-specific vulnerable signal is present
  secure_when:
  - profile-specific protection signal is present
  inconclusive_when:
  - target unavailable or prerequisites missing
outputs:
  title: Detect API debug mode exposure
  severity: high
  confidence: dynamic
