apiVersion: hex0r.io/v1alpha1
kind: ApiPentestRunbook
metadata:
  id: API-CONFIG-DEPRECATED-VERSION-007
  name: Detect reachable deprecated API versions
  version: 0.1.0
  status: experimental
  category: configuration
  tags:
  - api
  - configuration
  - fuzz
  - deprecated-api-version
mapping:
  owasp_api:
  - API9:2023
  cwe:
  - CWE-1104
selectors:
  api_types:
  - rest
  auth_types:
  - any
  required_capabilities: []
risk:
  intrusiveness: medium
  production_safe: false
  destructive: false
  max_requests: 100
  max_response_bytes: 65536
inputs:
- name: base_url
  type: uri
  required: true
  secret: false
steps:
- id: primary-probe
  action: kali.action
  handler: fuzz
  profile: deprecated-api-version
  arguments:
    url: '{{ target.base_url }}'
  timeout_seconds: 180
  evidence:
  - request_metadata
  - response_status
  - response_headers
  - redacted_response_sample
  - timestamps
evaluation:
  vulnerable_when:
  - fuzz_200_ratio > 0.15 or fuzz_wildcard==False
  secure_when:
  - fuzz_200_ratio <= 0.15 or fuzz_wildcard==True
  inconclusive_when:
  - target_reachable == false or prerequisites_missing == true
outputs:
  title: Detect reachable deprecated API versions
  severity: high
  confidence: dynamic
