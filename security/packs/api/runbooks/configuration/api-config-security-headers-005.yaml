apiVersion: hex0r.io/v1alpha1
kind: ApiPentestRunbook
metadata:
  id: API-CONFIG-SECURITY-HEADERS-005
  name: Assess relevant HTTP security headers
  version: 0.1.0
  status: experimental
  category: configuration
  tags:
  - api
  - configuration
  - headers
  - security-headers
mapping:
  owasp_api:
  - API8:2023
  cwe:
  - CWE-693
selectors:
  api_types:
  - rest
  auth_types:
  - any
  required_capabilities: []
risk:
  intrusiveness: passive
  production_safe: true
  destructive: false
  max_requests: 10
  max_response_bytes: 65536
inputs:
- name: base_url
  type: uri
  required: true
  secret: false
steps:
- id: primary-probe
  action: kali.action
  handler: headers
  profile: security-headers
  arguments:
    url: '{{ target.base_url }}'
  timeout_seconds: 60
  evidence:
  - request_metadata
  - response_status
  - response_headers
  - redacted_response_sample
  - timestamps
evaluation:
  vulnerable_when:
  - response_status in {200,401,403,500} and 'x-powered-by' in response_headers
  secure_when:
  - response_status in {401,403} or 'x-powered-by' not in response_headers
  inconclusive_when:
  - target_reachable == false or prerequisites_missing == true
outputs:
  title: Assess relevant HTTP security headers
  severity: low
  confidence: dynamic
