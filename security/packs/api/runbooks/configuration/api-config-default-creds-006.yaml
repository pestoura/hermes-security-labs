apiVersion: hex0r.io/v1alpha1
kind: ApiPentestRunbook
metadata:
  id: API-CONFIG-DEFAULT-CREDS-006
  name: Detect default administrative credentials in lab profiles
  version: 0.1.0
  status: experimental
  category: configuration
  tags:
  - api
  - configuration
  - workflow
  - default-credentials
mapping:
  owasp_api:
  - API8:2023
  cwe:
  - CWE-798
selectors:
  api_types:
  - rest
  auth_types:
  - any
  required_capabilities: []
risk:
  intrusiveness: medium
  production_safe: false
  destructive: false
  max_requests: 40
  max_response_bytes: 65536
inputs:
- name: base_url
  type: uri
  required: true
  secret: false
steps:
- id: primary-probe
  action: kali.action
  handler: workflow
  profile: default-credentials
  arguments:
    url: '{{ target.base_url }}'
  timeout_seconds: 120
  evidence:
  - request_metadata
  - response_status
  - response_headers
  - redacted_response_sample
  - timestamps
evaluation:
  vulnerable_when:
  - workflow_status in {'failed','blocked'}
  secure_when:
  - workflow_status in {'passed','completed'}
  inconclusive_when:
  - target_reachable == false or prerequisites_missing == true
outputs:
  title: Detect default administrative credentials in lab profiles
  severity: critical
  confidence: dynamic
