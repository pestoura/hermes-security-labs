apiVersion: hex0r.io/v1alpha1
kind: ApiPentestRunbook
metadata:
  id: API-CONFIG-CORS-CREDENTIALS-001
  name: Detect wildcard CORS with credentials
  version: 0.1.0
  status: experimental
  category: configuration
  tags:
  - api
  - configuration
  - headers
  - cors-wildcard-credentials
mapping:
  owasp_api:
  - API8:2023
  cwe:
  - CWE-942
selectors:
  api_types:
  - rest
  auth_types:
  - any
  required_capabilities: []
risk:
  intrusiveness: low
  production_safe: true
  destructive: false
  max_requests: 20
  max_response_bytes: 65536
inputs:
- name: base_url
  type: uri
  required: true
  secret: false
steps:
- id: primary-probe
  action: kali.action
  handler: headers
  profile: cors-wildcard-credentials
  arguments:
    url: '{{ target.base_url }}'
  timeout_seconds: 60
  evidence:
  - request_metadata
  - response_status
  - response_headers
  - redacted_response_sample
  - timestamps
evaluation:
  vulnerable_when:
  - response_headers is not None and len(response_headers) == 0 or handler_signal
    in {'insecure','vulnerable','failed'}
  secure_when:
  - response_headers is not None and len(response_headers) > 0 or handler_signal in
    {'secure','hardened','passed'}
  inconclusive_when:
  - target_reachable == false or prerequisites_missing == true
outputs:
  title: Detect wildcard CORS with credentials
  severity: high
  confidence: dynamic
