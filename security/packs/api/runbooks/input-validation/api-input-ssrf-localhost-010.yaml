apiVersion: hex0r.io/v1alpha1
kind: ApiPentestRunbook
metadata:
  id: API-INPUT-SSRF-LOCALHOST-010
  name: Detect SSRF access to local services
  version: 0.1.0
  status: experimental
  category: input-validation
  tags:
  - api
  - input-validation
  - http
  - ssrf-localhost
mapping:
  owasp_api:
  - API7:2023
  cwe:
  - CWE-918
selectors:
  api_types:
  - rest
  auth_types:
  - any
  required_capabilities: []
risk:
  intrusiveness: medium
  production_safe: false
  destructive: false
  max_requests: 20
  max_response_bytes: 65536
inputs:
- name: base_url
  type: uri
  required: true
  secret: false
steps:
- id: primary-probe
  action: kali.action
  handler: http
  profile: ssrf-localhost
  arguments:
    url: '{{ target.base_url }}'
  timeout_seconds: 60
  evidence:
  - request_metadata
  - response_status
  - response_headers
  - redacted_response_sample
  - timestamps
evaluation:
  vulnerable_when:
  - response_status in {200,401,403,500} and 'x-powered-by' in response_headers
  secure_when:
  - response_status in {401,403} or 'x-powered-by' not in response_headers
  inconclusive_when:
  - target_reachable == false or prerequisites_missing == true
outputs:
  title: Detect SSRF access to local services
  severity: critical
  confidence: dynamic
