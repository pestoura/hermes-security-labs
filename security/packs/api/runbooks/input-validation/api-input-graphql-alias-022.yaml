apiVersion: hex0r.io/v1alpha1
kind: ApiPentestRunbook
metadata:
  id: API-INPUT-GRAPHQL-ALIAS-022
  name: Assess GraphQL alias amplification
  version: 0.1.0
  status: experimental
  category: input-validation
  tags:
  - api
  - input-validation
  - graphql
  - graphql-alias-amplification
mapping:
  owasp_api:
  - API4:2023
  cwe:
  - CWE-770
selectors:
  api_types:
  - graphql
  auth_types:
  - any
  required_capabilities:
  - graphql
risk:
  intrusiveness: medium
  production_safe: false
  destructive: false
  max_requests: 50
  max_response_bytes: 65536
inputs:
- name: base_url
  type: uri
  required: true
  secret: false
steps:
- id: primary-probe
  action: kali.action
  handler: graphql
  profile: graphql-alias-amplification
  arguments:
    url: '{{ target.base_url }}'
  timeout_seconds: 120
  evidence:
  - request_metadata
  - response_status
  - response_headers
  - redacted_response_sample
  - timestamps
evaluation:
  vulnerable_when:
  - graphql_introspection_enabled or 'errors' in response_body
  secure_when:
  - not graphql_introspection_enabled and 'errors' not in response_body
  inconclusive_when:
  - target_reachable == false or prerequisites_missing == true
outputs:
  title: Assess GraphQL alias amplification
  severity: high
  confidence: dynamic
