apiVersion: hex0r.io/v1alpha1
kind: ApiPentestRunbook
metadata:
  id: API-INPUT-UPLOAD-POLYGLOT-015
  name: Detect unsafe file upload content validation
  version: 0.1.0
  status: experimental
  category: input-validation
  tags:
  - api
  - input-validation
  - workflow
  - file-upload-polyglot
mapping:
  owasp_api:
  - API8:2023
  cwe:
  - CWE-434
selectors:
  api_types:
  - rest
  auth_types:
  - any
  required_capabilities:
  - file_upload
risk:
  intrusiveness: high
  production_safe: false
  destructive: false
  max_requests: 40
  max_response_bytes: 65536
inputs:
- name: base_url
  type: uri
  required: true
  secret: false
steps:
- id: primary-probe
  action: kali.action
  handler: workflow
  profile: file-upload-polyglot
  arguments:
    url: '{{ target.base_url }}'
  timeout_seconds: 120
  evidence:
  - request_metadata
  - response_status
  - response_headers
  - redacted_response_sample
  - timestamps
evaluation:
  vulnerable_when:
  - workflow_status in {'failed','blocked'}
  secure_when:
  - workflow_status in {'passed','completed'}
  inconclusive_when:
  - target_reachable == false or prerequisites_missing == true
outputs:
  title: Detect unsafe file upload content validation
  severity: critical
  confidence: dynamic
