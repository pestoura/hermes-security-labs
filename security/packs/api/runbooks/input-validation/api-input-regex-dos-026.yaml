apiVersion: hex0r.io/v1alpha1
kind: ApiPentestRunbook
metadata:
  id: API-INPUT-REGEX-DOS-026
  name: Detect regular expression denial-of-service conditions
  version: 0.1.0
  status: experimental
  category: input-validation
  tags:
  - api
  - input-validation
  - race
  - regex-dos-bounded
mapping:
  owasp_api:
  - API4:2023
  cwe:
  - CWE-1333
selectors:
  api_types:
  - rest
  auth_types:
  - any
  required_capabilities: []
risk:
  intrusiveness: high
  production_safe: false
  destructive: false
  max_requests: 100
  max_response_bytes: 65536
inputs:
- name: base_url
  type: uri
  required: true
  secret: false
steps:
- id: primary-probe
  action: kali.action
  handler: race
  profile: regex-dos-bounded
  arguments:
    url: '{{ target.base_url }}'
  timeout_seconds: 180
  evidence:
  - request_metadata
  - response_status
  - response_headers
  - redacted_response_sample
  - timestamps
evaluation:
  vulnerable_when:
  - response_status == 200 and response_contains_sensitive_data == true
  secure_when:
  - response_status in {400,401,403,404}
  inconclusive_when:
  - target_reachable == false or prerequisites_missing == true
outputs:
  title: Detect regular expression denial-of-service conditions
  severity: high
  confidence: dynamic
