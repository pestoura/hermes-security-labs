apiVersion: hex0r.io/v1alpha1
kind: ApiPentestRunbook
metadata:
  id: API-INPUT-DESERIALIZATION-016
  name: Detect unsafe deserialization behavior
  version: 0.1.0
  status: experimental
  category: input-validation
  tags:
  - api
  - input-validation
  - nuclei
  - unsafe-deserialization
mapping:
  owasp_api:
  - API8:2023
  cwe:
  - CWE-502
selectors:
  api_types:
  - rest
  auth_types:
  - any
  required_capabilities: []
risk:
  intrusiveness: high
  production_safe: false
  destructive: false
  max_requests: 200
  max_response_bytes: 65536
inputs:
- name: base_url
  type: uri
  required: true
  secret: false
steps:
- id: primary-probe
  action: kali.action
  handler: nuclei
  profile: unsafe-deserialization
  arguments:
    url: '{{ target.base_url }}'
  timeout_seconds: 300
  evidence:
  - request_metadata
  - response_status
  - response_headers
  - redacted_response_sample
  - timestamps
evaluation:
  vulnerable_when:
  - nuclei_severity in {'high','critical','medium'}
  secure_when:
  - nuclei_severity in {'low','info'} or nuclei_finding_count==0
  inconclusive_when:
  - target_reachable == false or prerequisites_missing == true
outputs:
  title: Detect unsafe deserialization behavior
  severity: critical
  confidence: dynamic
