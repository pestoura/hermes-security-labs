apiVersion: hex0r.io/v1alpha1
kind: ApiPentestRunbook
metadata:
  id: API-INPUT-REQUEST-SMUGGLING-018
  name: Detect HTTP request smuggling indicators at API frontends
  version: 0.1.0
  status: experimental
  category: input-validation
  tags:
  - api
  - input-validation
  - nuclei
  - request-smuggling
mapping:
  owasp_api:
  - API8:2023
  cwe:
  - CWE-444
selectors:
  api_types:
  - rest
  auth_types:
  - any
  required_capabilities: []
risk:
  intrusiveness: high
  production_safe: false
  destructive: false
  max_requests: 200
  max_response_bytes: 65536
inputs:
- name: base_url
  type: uri
  required: true
  secret: false
steps:
- id: primary-probe
  action: kali.action
  handler: nuclei
  profile: request-smuggling
  arguments:
    url: '{{ target.base_url }}'
  timeout_seconds: 300
  evidence:
  - request_metadata
  - response_status
  - response_headers
  - redacted_response_sample
  - timestamps
evaluation:
  vulnerable_when:
  - profile-specific vulnerable signal is present
  secure_when:
  - profile-specific protection signal is present
  inconclusive_when:
  - target unavailable or prerequisites missing
outputs:
  title: Detect HTTP request smuggling indicators at API frontends
  severity: critical
  confidence: dynamic
