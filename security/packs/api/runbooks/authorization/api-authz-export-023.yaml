apiVersion: hex0r.io/v1alpha1
kind: ApiPentestRunbook
metadata:
  id: API-AUTHZ-EXPORT-023
  name: Test authorization on bulk export endpoints
  version: 0.1.0
  status: experimental
  category: authorization
  tags:
  - api
  - authorization
  - workflow
  - export-authorization
mapping:
  owasp_api:
  - API5:2023
  cwe:
  - CWE-862
selectors:
  api_types:
  - rest
  auth_types:
  - api_key
  - bearer
  - cookie
  - jwt
  - oauth2
  - oidc
  required_capabilities:
  - two_test_identities
risk:
  intrusiveness: medium
  production_safe: false
  destructive: false
  max_requests: 40
  max_response_bytes: 65536
inputs:
- name: base_url
  type: uri
  required: true
  secret: false
steps:
- id: primary-probe
  action: kali.action
  handler: workflow
  profile: export-authorization
  arguments:
    url: '{{ target.base_url }}'
  timeout_seconds: 120
  evidence:
  - request_metadata
  - response_status
  - response_headers
  - redacted_response_sample
  - timestamps
evaluation:
  vulnerable_when:
  - profile-specific vulnerable signal is present
  secure_when:
  - profile-specific protection signal is present
  inconclusive_when:
  - target unavailable or prerequisites missing
outputs:
  title: Test authorization on bulk export endpoints
  severity: critical
  confidence: dynamic
