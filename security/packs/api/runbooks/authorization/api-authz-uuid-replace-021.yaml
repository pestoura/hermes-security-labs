apiVersion: hex0r.io/v1alpha1
kind: ApiPentestRunbook
metadata:
  id: API-AUTHZ-UUID-REPLACE-021
  name: Test authorization after UUID replacement
  version: 0.1.0
  status: experimental
  category: authorization
  tags:
  - api
  - authorization
  - workflow
  - uuid-replacement
mapping:
  owasp_api:
  - API1:2023
  cwe:
  - CWE-639
selectors:
  api_types:
  - rest
  auth_types:
  - api_key
  - bearer
  - cookie
  - jwt
  - oauth2
  - oidc
  required_capabilities:
  - two_test_identities
risk:
  intrusiveness: medium
  production_safe: false
  destructive: false
  max_requests: 40
  max_response_bytes: 65536
inputs:
- name: base_url
  type: uri
  required: true
  secret: false
steps:
- id: primary-probe
  action: kali.action
  handler: workflow
  profile: uuid-replacement
  arguments:
    url: '{{ target.base_url }}'
  timeout_seconds: 120
  evidence:
  - request_metadata
  - response_status
  - response_headers
  - redacted_response_sample
  - timestamps
evaluation:
  vulnerable_when:
  - handler_signal in {'failed','blocked'}
  secure_when:
  - handler_signal in {'secure','hardened','passed'}
  inconclusive_when:
  - target_reachable == false or prerequisites_missing == true
outputs:
  title: Test authorization after UUID replacement
  severity: high
  confidence: dynamic
