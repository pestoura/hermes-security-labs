apiVersion: hex0r.io/v1alpha1
kind: ApiPentestRunbook
metadata:
  id: API-AUTHZ-INDIRECT-REF-020
  name: Test indirect object reference tampering
  version: 0.1.0
  status: experimental
  category: authorization
  tags:
  - api
  - authorization
  - workflow
  - indirect-reference-tampering
mapping:
  owasp_api:
  - API1:2023
  cwe:
  - CWE-639
selectors:
  api_types:
  - rest
  auth_types:
  - api_key
  - bearer
  - cookie
  - jwt
  - oauth2
  - oidc
  required_capabilities:
  - two_test_identities
risk:
  intrusiveness: medium
  production_safe: false
  destructive: false
  max_requests: 40
  max_response_bytes: 65536
inputs:
- name: base_url
  type: uri
  required: true
  secret: false
steps:
- id: primary-probe
  action: kali.action
  handler: workflow
  profile: indirect-reference-tampering
  arguments:
    url: '{{ target.base_url }}'
  timeout_seconds: 120
  evidence:
  - request_metadata
  - response_status
  - response_headers
  - redacted_response_sample
  - timestamps
evaluation:
  vulnerable_when:
  - object_owner_id != subject_id and subject_id != '' and response_status == 200
  secure_when:
  - object_owner_id == subject_id or subject_id == ''
  inconclusive_when:
  - target_reachable == false or prerequisites_missing == true
outputs:
  title: Test indirect object reference tampering
  severity: high
  confidence: dynamic
