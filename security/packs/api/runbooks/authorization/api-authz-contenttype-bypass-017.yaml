apiVersion: hex0r.io/v1alpha1
kind: ApiPentestRunbook
metadata:
  id: API-AUTHZ-CONTENTTYPE-BYPASS-017
  name: Test authorization bypass using alternate content types
  version: 0.1.0
  status: experimental
  category: authorization
  tags:
  - api
  - authorization
  - http
  - content-type-authorization-bypass
mapping:
  owasp_api:
  - API5:2023
  cwe:
  - CWE-863
selectors:
  api_types:
  - rest
  auth_types:
  - api_key
  - bearer
  - cookie
  - jwt
  - oauth2
  - oidc
  required_capabilities:
  - two_test_identities
risk:
  intrusiveness: medium
  production_safe: false
  destructive: false
  max_requests: 20
  max_response_bytes: 65536
inputs:
- name: base_url
  type: uri
  required: true
  secret: false
steps:
- id: primary-probe
  action: kali.action
  handler: http
  profile: content-type-authorization-bypass
  arguments:
    url: '{{ target.base_url }}'
  timeout_seconds: 60
  evidence:
  - request_metadata
  - response_status
  - response_headers
  - redacted_response_sample
  - timestamps
evaluation:
  vulnerable_when:
  - object_owner_id != subject_id and subject_id != '' and response_status == 200
  secure_when:
  - object_owner_id == subject_id or subject_id == ''
  inconclusive_when:
  - target_reachable == false or prerequisites_missing == true
outputs:
  title: Test authorization bypass using alternate content types
  severity: high
  confidence: dynamic
