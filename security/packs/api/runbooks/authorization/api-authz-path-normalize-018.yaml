apiVersion: hex0r.io/v1alpha1
kind: ApiPentestRunbook
metadata:
  id: API-AUTHZ-PATH-NORMALIZE-018
  name: Test path normalization authorization bypass
  version: 0.1.0
  status: experimental
  category: authorization
  tags:
  - api
  - authorization
  - http
  - path-normalization-authorization
mapping:
  owasp_api:
  - API5:2023
  cwe:
  - CWE-863
selectors:
  api_types:
  - rest
  auth_types:
  - api_key
  - bearer
  - cookie
  - jwt
  - oauth2
  - oidc
  required_capabilities:
  - two_test_identities
risk:
  intrusiveness: medium
  production_safe: false
  destructive: false
  max_requests: 20
  max_response_bytes: 65536
inputs:
- name: base_url
  type: uri
  required: true
  secret: false
steps:
- id: primary-probe
  action: kali.action
  handler: http
  profile: path-normalization-authorization
  arguments:
    url: '{{ target.base_url }}'
  timeout_seconds: 60
  evidence:
  - request_metadata
  - response_status
  - response_headers
  - redacted_response_sample
  - timestamps
evaluation:
  vulnerable_when:
  - response_status in {200,401,403,500} and 'x-powered-by' in response_headers
  secure_when:
  - response_status in {401,403} or 'x-powered-by' not in response_headers
  inconclusive_when:
  - target_reachable == false or prerequisites_missing == true
outputs:
  title: Test path normalization authorization bypass
  severity: high
  confidence: dynamic
