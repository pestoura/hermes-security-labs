apiVersion: hex0r.io/v1alpha1
kind: ApiPentestRunbook
metadata:
  id: API-AUTH-UNSIGNED-JWT-004
  name: Reject unsigned JWT tokens
  version: 0.1.0
  status: experimental
  category: authentication
  tags:
  - api
  - authentication
  - jwt
  - unsigned-jwt
mapping:
  owasp_api:
  - API2:2023
  cwe:
  - CWE-347
selectors:
  api_types:
  - rest
  auth_types:
  - bearer
  - jwt
  - oauth2
  - oidc
  required_capabilities:
  - token_capture
risk:
  intrusiveness: medium
  production_safe: false
  destructive: false
  max_requests: 40
  max_response_bytes: 65536
inputs:
- name: base_url
  type: uri
  required: true
  secret: false
steps:
- id: primary-probe
  action: kali.action
  handler: jwt
  profile: unsigned-jwt
  arguments:
    url: '{{ target.base_url }}'
  timeout_seconds: 120
  evidence:
  - request_metadata
  - response_status
  - response_headers
  - redacted_response_sample
  - timestamps
evaluation:
  vulnerable_when:
  - jwt_claims_aud is None or jwt_claims_aud not in {'hex0r-api','crapi'}
  secure_when:
  - jwt_claims_aud in {'hex0r-api','crapi'} and jwt_signature_valid == true
  inconclusive_when:
  - target_reachable == false or prerequisites_missing == true
outputs:
  title: Reject unsigned JWT tokens
  severity: critical
  confidence: dynamic
