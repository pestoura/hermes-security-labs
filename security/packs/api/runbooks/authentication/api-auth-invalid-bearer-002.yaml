apiVersion: hex0r.io/v1alpha1
kind: ApiPentestRunbook
metadata:
  id: API-AUTH-INVALID-BEARER-002
  name: Reject malformed or invalid bearer tokens
  version: 0.1.0
  status: experimental
  category: authentication
  tags:
  - api
  - authentication
  - http
  - invalid-bearer-token
mapping:
  owasp_api:
  - API2:2023
  cwe:
  - CWE-287
selectors:
  api_types:
  - rest
  auth_types:
  - any
  required_capabilities: []
risk:
  intrusiveness: medium
  production_safe: false
  destructive: false
  max_requests: 20
  max_response_bytes: 65536
inputs:
- name: base_url
  type: uri
  required: true
  secret: false
steps:
- id: primary-probe
  action: kali.action
  handler: http
  profile: invalid-bearer-token
  arguments:
    url: '{{ target.base_url }}'
  timeout_seconds: 60
  evidence:
  - request_metadata
  - response_status
  - response_headers
  - redacted_response_sample
  - timestamps
evaluation:
  vulnerable_when:
  - response_status == 200 and auth_accepted == false
  secure_when:
  - response_status in {401,403}
  inconclusive_when:
  - target_reachable == false or prerequisites_missing == true
outputs:
  title: Reject malformed or invalid bearer tokens
  severity: high
  confidence: dynamic
