apiVersion: hex0r.io/v1alpha1
kind: ApiPentestRunbook
metadata:
  id: API-AUTH-RESET-ENTROPY-023
  name: Assess password reset token entropy and predictability
  version: 0.1.0
  status: experimental
  category: authentication
  tags:
  - api
  - authentication
  - workflow
  - password-reset-entropy
mapping:
  owasp_api:
  - API2:2023
  cwe:
  - CWE-330
selectors:
  api_types:
  - rest
  auth_types:
  - any
  required_capabilities: []
risk:
  intrusiveness: medium
  production_safe: false
  destructive: false
  max_requests: 40
  max_response_bytes: 65536
inputs:
- name: base_url
  type: uri
  required: true
  secret: false
steps:
- id: primary-probe
  action: kali.action
  handler: workflow
  profile: password-reset-entropy
  arguments:
    url: '{{ target.base_url }}'
  timeout_seconds: 120
  evidence:
  - request_metadata
  - response_status
  - response_headers
  - redacted_response_sample
  - timestamps
evaluation:
  vulnerable_when:
  - profile-specific vulnerable signal is present
  secure_when:
  - profile-specific protection signal is present
  inconclusive_when:
  - target unavailable or prerequisites missing
outputs:
  title: Assess password reset token entropy and predictability
  severity: critical
  confidence: dynamic
