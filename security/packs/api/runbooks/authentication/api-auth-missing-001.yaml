apiVersion: hex0r.io/v1alpha1
kind: ApiPentestRunbook
metadata:
  id: API-AUTH-MISSING-001
  name: Detect endpoints missing required authentication
  version: 0.1.0
  status: experimental
  category: authentication
  tags:
  - api
  - authentication
  - http
  - missing-authentication
mapping:
  owasp_api:
  - API2:2023
  cwe:
  - CWE-306
selectors:
  api_types:
  - rest
  auth_types:
  - any
  required_capabilities: []
risk:
  intrusiveness: medium
  production_safe: false
  destructive: false
  max_requests: 20
  max_response_bytes: 65536
inputs:
- name: base_url
  type: uri
  required: true
  secret: false
steps:
- id: primary-probe
  action: kali.action
  handler: http
  profile: missing-authentication
  arguments:
    url: '{{ target.base_url }}'
  timeout_seconds: 60
  evidence:
  - request_metadata
  - response_status
  - response_headers
  - redacted_response_sample
  - timestamps
evaluation:
  vulnerable_when:
  - auth.accepted == false and response_status == 200
  secure_when:
  - auth.accepted == true or response_status in {401,403}
  inconclusive_when:
  - target_reachable == false or prerequisites_missing == true
outputs:
  title: Detect endpoints missing required authentication
  severity: high
  confidence: dynamic
