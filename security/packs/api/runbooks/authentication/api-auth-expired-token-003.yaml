apiVersion: hex0r.io/v1alpha1
kind: ApiPentestRunbook
metadata:
  id: API-AUTH-EXPIRED-TOKEN-003
  name: Reject expired access tokens
  version: 0.1.0
  status: experimental
  category: authentication
  tags:
  - api
  - authentication
  - jwt
  - expired-token
mapping:
  owasp_api:
  - API2:2023
  cwe:
  - CWE-613
selectors:
  api_types:
  - rest
  auth_types:
  - bearer
  - jwt
  - oauth2
  - oidc
  required_capabilities:
  - token_capture
risk:
  intrusiveness: medium
  production_safe: false
  destructive: false
  max_requests: 40
  max_response_bytes: 65536
inputs:
- name: base_url
  type: uri
  required: true
  secret: false
steps:
- id: primary-probe
  action: kali.action
  handler: jwt
  profile: expired-token
  arguments:
    url: '{{ target.base_url }}'
  timeout_seconds: 120
  evidence:
  - request_metadata
  - response_status
  - response_headers
  - redacted_response_sample
  - timestamps
evaluation:
  vulnerable_when:
  - response_status==200 and 'expired' not in body_sample
  secure_when:
  - response_status==401 and 'expired' in body_sample
  inconclusive_when:
  - target_reachable == false or prerequisites_missing == true
outputs:
  title: Reject expired access tokens
  severity: high
  confidence: dynamic
