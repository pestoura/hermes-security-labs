apiVersion: hex0r.io/v1alpha1
kind: ApiPentestRunbook
metadata:
  id: API-DISC-SPEC-DIFF-006
  name: Identify undocumented operations by comparing observations with OpenAPI
  version: 0.1.0
  status: experimental
  category: discovery
  tags:
  - api
  - discovery
  - openapi
  - openapi-observed-diff
mapping:
  owasp_api:
  - API9:2023
  cwe:
  - CWE-200
selectors:
  api_types:
  - rest
  auth_types:
  - any
  required_capabilities: []
risk:
  intrusiveness: low
  production_safe: true
  destructive: false
  max_requests: 20
  max_response_bytes: 65536
inputs:
- name: base_url
  type: uri
  required: true
  secret: false
steps:
- id: primary-probe
  action: kali.action
  handler: openapi
  profile: openapi-observed-diff
  arguments:
    url: '{{ target.base_url }}'
  timeout_seconds: 60
  evidence:
  - request_metadata
  - response_status
  - response_headers
  - redacted_response_sample
  - timestamps
evaluation:
  vulnerable_when:
  - response_contains_schema == true or openapi_security_schemes_present == true
  secure_when:
  - response_contains_schema == false and openapi_security_schemes_present == false
  inconclusive_when:
  - target_reachable == false or prerequisites_missing == true
outputs:
  title: Identify undocumented operations by comparing observations with OpenAPI
  severity: low
  confidence: dynamic
