apiVersion: hex0r.io/v1alpha1
kind: ApiPentestRunbook
metadata:
  id: API-DISC-ENDPOINT-WORDLIST-004
  name: Discover undocumented API endpoints with bounded wordlists
  version: 0.1.0
  status: experimental
  category: discovery
  tags:
  - api
  - discovery
  - fuzz
  - api-endpoint-discovery
mapping:
  owasp_api:
  - API9:2023
  cwe:
  - CWE-200
selectors:
  api_types:
  - rest
  auth_types:
  - any
  required_capabilities: []
risk:
  intrusiveness: medium
  production_safe: false
  destructive: false
  max_requests: 100
  max_response_bytes: 65536
inputs:
- name: base_url
  type: uri
  required: true
  secret: false
steps:
- id: primary-probe
  action: kali.action
  handler: fuzz
  profile: api-endpoint-discovery
  arguments:
    url: '{{ target.base_url }}'
  timeout_seconds: 180
  evidence:
  - request_metadata
  - response_status
  - response_headers
  - redacted_response_sample
  - timestamps
evaluation:
  vulnerable_when:
  - response_contains_schema == true or openapi_security_schemes_present == true
  secure_when:
  - response_contains_schema == false and openapi_security_schemes_present == false
  inconclusive_when:
  - target_reachable == false or prerequisites_missing == true
outputs:
  title: Discover undocumented API endpoints with bounded wordlists
  severity: info
  confidence: dynamic
