apiVersion: hex0r.io/v1alpha1
kind: ApiPentestRunbook
metadata:
  id: API-DISC-VERSION-ENUM-003
  name: Enumerate API versions and deprecated base paths
  version: 0.1.0
  status: experimental
  category: discovery
  tags:
  - api
  - discovery
  - fuzz
  - api-version-enumeration
mapping:
  owasp_api:
  - API9:2023
  cwe:
  - CWE-200
selectors:
  api_types:
  - rest
  auth_types:
  - any
  required_capabilities: []
risk:
  intrusiveness: medium
  production_safe: false
  destructive: false
  max_requests: 100
  max_response_bytes: 65536
inputs:
- name: base_url
  type: uri
  required: true
  secret: false
steps:
- id: primary-probe
  action: kali.action
  handler: fuzz
  profile: api-version-enumeration
  arguments:
    url: '{{ target.base_url }}'
  timeout_seconds: 180
  evidence:
  - request_metadata
  - response_status
  - response_headers
  - redacted_response_sample
  - timestamps
evaluation:
  vulnerable_when:
  - fuzz_200_ratio > 0.15 or fuzz_wildcard==False
  secure_when:
  - fuzz_200_ratio <= 0.15 or fuzz_wildcard==True
  inconclusive_when:
  - target_reachable == false or prerequisites_missing == true
outputs:
  title: Enumerate API versions and deprecated base paths
  severity: info
  confidence: dynamic
