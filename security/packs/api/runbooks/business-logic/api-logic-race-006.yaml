apiVersion: hex0r.io/v1alpha1
kind: ApiPentestRunbook
metadata:
  id: API-LOGIC-RACE-006
  name: Detect business transaction race conditions
  version: 0.1.0
  status: experimental
  category: business-logic
  tags:
  - api
  - business-logic
  - race
  - business-race-condition
mapping:
  owasp_api:
  - API6:2023
  cwe:
  - CWE-362
selectors:
  api_types:
  - rest
  auth_types:
  - any
  required_capabilities:
  - stateful_workflows
risk:
  intrusiveness: high
  production_safe: false
  destructive: false
  max_requests: 100
  max_response_bytes: 65536
inputs:
- name: base_url
  type: uri
  required: true
  secret: false
steps:
- id: primary-probe
  action: kali.action
  handler: race
  profile: business-race-condition
  arguments:
    url: '{{ target.base_url }}'
  timeout_seconds: 180
  evidence:
  - request_metadata
  - response_status
  - response_headers
  - redacted_response_sample
  - timestamps
evaluation:
  vulnerable_when:
  - profile-specific vulnerable signal is present
  secure_when:
  - profile-specific protection signal is present
  inconclusive_when:
  - target unavailable or prerequisites missing
outputs:
  title: Detect business transaction race conditions
  severity: critical
  confidence: dynamic
