apiVersion: hex0r.io/v1alpha1
kind: ApiPentestRunbook
metadata:
  id: API-LOGIC-INVENTORY-010
  name: Detect inventory oversell through concurrent API calls
  version: 0.1.0
  status: experimental
  category: business-logic
  tags:
  - api
  - business-logic
  - race
  - inventory-oversell
mapping:
  owasp_api:
  - API6:2023
  cwe:
  - CWE-362
selectors:
  api_types:
  - rest
  auth_types:
  - any
  required_capabilities:
  - stateful_workflows
risk:
  intrusiveness: high
  production_safe: false
  destructive: false
  max_requests: 100
  max_response_bytes: 65536
inputs:
- name: base_url
  type: uri
  required: true
  secret: false
steps:
- id: primary-probe
  action: kali.action
  handler: race
  profile: inventory-oversell
  arguments:
    url: '{{ target.base_url }}'
  timeout_seconds: 180
  evidence:
  - request_metadata
  - response_status
  - response_headers
  - redacted_response_sample
  - timestamps
evaluation:
  vulnerable_when:
  - entity.id != '' and entity.owner_id != '' and entity.owner_id != subject.id
  secure_when:
  - entity.id == '' or entity.owner_id == '' or entity.owner_id == subject.id
  inconclusive_when:
  - target_reachable == false or prerequisites_missing == true
outputs:
  title: Detect inventory oversell through concurrent API calls
  severity: high
  confidence: dynamic
