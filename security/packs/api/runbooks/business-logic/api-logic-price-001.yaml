apiVersion: hex0r.io/v1alpha1
kind: ApiPentestRunbook
metadata:
  id: API-LOGIC-PRICE-001
  name: Detect client-controlled price manipulation
  version: 0.1.0
  status: experimental
  category: business-logic
  tags:
  - api
  - business-logic
  - workflow
  - price-tampering
mapping:
  owasp_api:
  - API6:2023
  cwe:
  - CWE-472
selectors:
  api_types:
  - rest
  auth_types:
  - any
  required_capabilities:
  - stateful_workflows
risk:
  intrusiveness: medium
  production_safe: false
  destructive: true
  max_requests: 40
  max_response_bytes: 65536
inputs:
- name: base_url
  type: uri
  required: true
  secret: false
steps:
- id: primary-probe
  action: kali.action
  handler: workflow
  profile: price-tampering
  arguments:
    url: '{{ target.base_url }}'
  timeout_seconds: 120
  evidence:
  - request_metadata
  - response_status
  - response_headers
  - redacted_response_sample
  - timestamps
evaluation:
  vulnerable_when:
  - entity_id != '' and entity_owner_id != '' and entity_owner_id != subject_id
  secure_when:
  - entity_id == '' or entity_owner_id == '' or entity_owner_id == subject_id
  inconclusive_when:
  - target_reachable == false or prerequisites_missing == true
outputs:
  title: Detect client-controlled price manipulation
  severity: critical
  confidence: dynamic
