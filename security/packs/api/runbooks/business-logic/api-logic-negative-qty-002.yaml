apiVersion: hex0r.io/v1alpha1
kind: ApiPentestRunbook
metadata:
  id: API-LOGIC-NEGATIVE-QTY-002
  name: Detect negative or invalid quantity abuse
  version: 0.1.0
  status: experimental
  category: business-logic
  tags:
  - api
  - business-logic
  - workflow
  - negative-quantity
mapping:
  owasp_api:
  - API6:2023
  cwe:
  - CWE-20
selectors:
  api_types:
  - rest
  auth_types:
  - any
  required_capabilities:
  - stateful_workflows
risk:
  intrusiveness: medium
  production_safe: false
  destructive: false
  max_requests: 40
  max_response_bytes: 65536
inputs:
- name: base_url
  type: uri
  required: true
  secret: false
steps:
- id: primary-probe
  action: kali.action
  handler: workflow
  profile: negative-quantity
  arguments:
    url: '{{ target.base_url }}'
  timeout_seconds: 120
  evidence:
  - request_metadata
  - response_status
  - response_headers
  - redacted_response_sample
  - timestamps
evaluation:
  vulnerable_when:
  - workflow_status in {'failed','blocked'}
  secure_when:
  - workflow_status in {'passed','completed'}
  inconclusive_when:
  - target_reachable == false or prerequisites_missing == true
outputs:
  title: Detect negative or invalid quantity abuse
  severity: high
  confidence: dynamic
