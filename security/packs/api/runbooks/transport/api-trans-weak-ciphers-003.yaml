apiVersion: hex0r.io/v1alpha1
kind: ApiPentestRunbook
metadata:
  id: API-TRANS-WEAK-CIPHERS-003
  name: Detect weak TLS cipher suites
  version: 0.1.0
  status: experimental
  category: transport
  tags:
  - api
  - transport
  - tls
  - weak-cipher-suites
mapping:
  owasp_api:
  - API8:2023
  cwe:
  - CWE-327
selectors:
  api_types:
  - rest
  auth_types:
  - any
  required_capabilities: []
risk:
  intrusiveness: passive
  production_safe: true
  destructive: false
  max_requests: 10
  max_response_bytes: 65536
inputs:
- name: base_url
  type: uri
  required: true
  secret: false
steps:
- id: primary-probe
  action: kali.action
  handler: tls
  profile: weak-cipher-suites
  arguments:
    url: '{{ target.base_url }}'
  timeout_seconds: 60
  evidence:
  - request_metadata
  - response_status
  - response_headers
  - redacted_response_sample
  - timestamps
evaluation:
  vulnerable_when:
  - profile-specific vulnerable signal is present
  secure_when:
  - profile-specific protection signal is present
  inconclusive_when:
  - target unavailable or prerequisites missing
outputs:
  title: Detect weak TLS cipher suites
  severity: medium
  confidence: dynamic
