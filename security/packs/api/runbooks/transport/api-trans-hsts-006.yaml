apiVersion: hex0r.io/v1alpha1
kind: ApiPentestRunbook
metadata:
  id: API-TRANS-HSTS-006
  name: Check HSTS enforcement for HTTPS APIs
  version: 0.1.0
  status: experimental
  category: transport
  tags:
  - api
  - transport
  - headers
  - hsts-missing
mapping:
  owasp_api:
  - API8:2023
  cwe:
  - CWE-319
selectors:
  api_types:
  - rest
  auth_types:
  - any
  required_capabilities: []
risk:
  intrusiveness: passive
  production_safe: true
  destructive: false
  max_requests: 10
  max_response_bytes: 65536
inputs:
- name: base_url
  type: uri
  required: true
  secret: false
steps:
- id: primary-probe
  action: kali.action
  handler: headers
  profile: hsts-missing
  arguments:
    url: '{{ target.base_url }}'
  timeout_seconds: 60
  evidence:
  - request_metadata
  - response_status
  - response_headers
  - redacted_response_sample
  - timestamps
evaluation:
  vulnerable_when:
  - response_headers is not None and len(response_headers) == 0 or handler_signal
    in {'insecure','vulnerable','failed'}
  secure_when:
  - response_headers is not None and len(response_headers) > 0 or handler_signal in
    {'secure','hardened','passed'}
  inconclusive_when:
  - target_reachable == false or prerequisites_missing == true
outputs:
  title: Check HSTS enforcement for HTTPS APIs
  severity: low
  confidence: dynamic
