apiVersion: hex0r.io/v1alpha1
kind: ApiPentestRunbook
metadata:
  id: API-TRANS-WEAK-TLS-002
  name: Detect deprecated TLS protocol versions
  version: 0.1.0
  status: experimental
  category: transport
  tags:
  - api
  - transport
  - tls
  - weak-tls-versions
mapping:
  owasp_api:
  - API8:2023
  cwe:
  - CWE-326
selectors:
  api_types:
  - rest
  auth_types:
  - any
  required_capabilities: []
risk:
  intrusiveness: passive
  production_safe: true
  destructive: false
  max_requests: 10
  max_response_bytes: 65536
inputs:
- name: base_url
  type: uri
  required: true
  secret: false
steps:
- id: primary-probe
  action: kali.action
  handler: tls
  profile: weak-tls-versions
  arguments:
    url: '{{ target.base_url }}'
  timeout_seconds: 60
  evidence:
  - request_metadata
  - response_status
  - response_headers
  - redacted_response_sample
  - timestamps
evaluation:
  vulnerable_when:
  - tls_cert_expired == true or tls_hostname_mismatch == true or tls_weak_ciphers
    == true or tls_plaintext_allowed == true
  secure_when:
  - tls_cert_expired == false and tls_hostname_mismatch == false and tls_weak_ciphers
    == false and tls_plaintext_allowed == false
  inconclusive_when:
  - target_reachable == false or prerequisites_missing == true
outputs:
  title: Detect deprecated TLS protocol versions
  severity: high
  confidence: dynamic
