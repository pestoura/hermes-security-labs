apiVersion: hex0r.io/v1alpha1
kind: ApiPentestRunbook
metadata:
  id: API-TRANS-PLAINTEXT-HTTP-001
  name: Detect API access over plaintext HTTP
  version: 0.1.0
  status: experimental
  category: transport
  tags:
  - api
  - transport
  - http
  - plaintext-http
mapping:
  owasp_api:
  - API8:2023
  cwe:
  - CWE-319
selectors:
  api_types:
  - rest
  auth_types:
  - any
  required_capabilities: []
risk:
  intrusiveness: low
  production_safe: true
  destructive: false
  max_requests: 10
  max_response_bytes: 65536
inputs:
- name: base_url
  type: uri
  required: true
  secret: false
steps:
- id: primary-probe
  action: kali.action
  handler: http
  profile: plaintext-http
  arguments:
    url: '{{ target.base_url }}'
  timeout_seconds: 60
  evidence:
  - request_metadata
  - response_status
  - response_headers
  - redacted_response_sample
  - timestamps
evaluation:
  vulnerable_when: []
  secure_when: []
  inconclusive_when:
  - target_reachable == false or prerequisites_missing == true
  - family_signal_producer_required
outputs:
  title: Detect API access over plaintext HTTP
  severity: high
  confidence: dynamic
