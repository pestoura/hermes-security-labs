apiVersion: hex0r.io/v1alpha1
kind: ApiPentestRunbook
metadata:
  id: API-TRANS-INSECURE-ABSOLUTE-URL-008
  name: Detect insecure absolute URLs in API responses
  version: 0.1.0
  status: experimental
  category: transport
  tags:
  - api
  - transport
  - http
  - insecure-absolute-urls
mapping:
  owasp_api:
  - API3:2023
  cwe:
  - CWE-319
selectors:
  api_types:
  - rest
  auth_types:
  - any
  required_capabilities: []
risk:
  intrusiveness: low
  production_safe: true
  destructive: false
  max_requests: 20
  max_response_bytes: 65536
inputs:
- name: base_url
  type: uri
  required: true
  secret: false
steps:
- id: primary-probe
  action: kali.action
  handler: http
  profile: insecure-absolute-urls
  arguments:
    url: '{{ target.base_url }}'
  timeout_seconds: 60
  evidence:
  - request_metadata
  - response_status
  - response_headers
  - redacted_response_sample
  - timestamps
evaluation:
  vulnerable_when: []
  secure_when: []
  inconclusive_when:
  - target_reachable == false or prerequisites_missing == true
  - family_signal_producer_required
outputs:
  title: Detect insecure absolute URLs in API responses
  severity: medium
  confidence: dynamic
