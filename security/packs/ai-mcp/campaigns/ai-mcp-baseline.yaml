apiVersion: security.hex0r.io/v1alpha1
kind: SecurityCampaign
metadata:
  id: ai-mcp-baseline
  name: AI and MCP baseline
  status: experimental
domain: ai-mcp
selectors:
  categories:
  - agent-discovery
  - direct-prompt-injection
  - mcp-authorization
  - output-integrity
execution:
  mode: sequential
  max_parallel: 1
  stop_on_scope_violation: true
  stop_on_cleanup_failure: true
