apiVersion: security.hex0r.io/v1alpha1
kind: SecurityCampaign
metadata:
  id: mcp-tool-security
  name: MCP and tool security
  status: experimental
domain: ai-mcp
selectors:
  categories:
  - tool_poisoning
  - agency
  - mcp
execution:
  mode: sequential
  max_parallel: 1
  stop_on_scope_violation: true
  stop_on_cleanup_failure: true
