apiVersion: security.hex0r.io/v1alpha1
kind: SecurityRunbook
metadata:
  id: DEVSEC-SECRETS-004
  name: Verify Slack Token
  version: 1.0.0
  status: experimental
  domain: devsecops
  category: secrets
  tags:
  - owasp-devsecops
  - secrets
  - slack-token
  - typed-execution
selectors:
  target_types:
  - git-repository
  capabilities:
  - repository-read
  - secret-scanner
risk:
  intrusiveness: passive
  destructive: false
  production_safe: true
  max_actions: 5
  timeout_seconds: 180
steps:
- id: collect-baseline
  provider: repository
  action: inventory
  profile: secrets-baseline
  arguments:
    target_ref: '{{ target.ref }}'
    evidence_ref: baseline/DEVSEC-SECRETS-004
    read_only: true
    redact_secrets: true
- id: execute-control
  provider: secrets
  action: scan
  profile: slack-token
  arguments:
    target_ref: '{{ target.ref }}'
    control_id: DEVSEC-SECRETS-004
    rule_profile: slack-token
    fail_closed: false
    redact_secrets: true
    collect_tool_version: true
    evidence_ref: findings/DEVSEC-SECRETS-004
- id: verify-evidence
  provider: evidence
  action: verify
  profile: deterministic-finding-bundle
  arguments:
    target_ref: '{{ target.ref }}'
    control_id: DEVSEC-SECRETS-004
    required_artifacts:
    - tool-version
    - scan-summary
    - sanitised-observations
    redact_secrets: true
evaluation:
  vulnerable_when:
  - control.slack_token.status equals non_compliant
  - control.slack_token.evidence_count is greater than zero
  - scanner.completed equals true and scanner.error_count equals zero
  secure_when:
  - control.slack_token.status equals compliant
  - control.slack_token.evidence_count equals zero
  - scanner.completed equals true and baseline.coverage_complete equals true
  inconclusive_when:
  - control.slack_token.status equals unknown
  - scanner.completed equals false or scanner.error_count is greater than zero
  - baseline.coverage_complete equals false or required evidence is missing
outputs:
  title: Slack Token control result
  severity: medium
  confidence: dynamic
