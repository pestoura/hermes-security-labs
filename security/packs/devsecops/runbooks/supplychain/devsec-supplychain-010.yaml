apiVersion: security.hex0r.io/v1alpha1
kind: SecurityRunbook
metadata:
  id: DEVSEC-SUPPLYCHAIN-010
  name: Verify Dependency Provenance
  version: 1.0.0
  status: experimental
  domain: devsecops
  category: supplychain
  tags:
  - dependency-provenance
  - owasp-devsecops
  - supplychain
  - typed-execution
selectors:
  target_types:
  - software-artifact
  capabilities:
  - attestation-read
  - signature-verify
risk:
  intrusiveness: passive
  destructive: false
  production_safe: true
  max_actions: 5
  timeout_seconds: 180
steps:
- id: collect-baseline
  provider: repository
  action: inventory
  profile: supplychain-baseline
  arguments:
    target_ref: '{{ target.ref }}'
    evidence_ref: baseline/DEVSEC-SUPPLYCHAIN-010
    read_only: true
    redact_secrets: true
- id: execute-control
  provider: supplychain
  action: verify
  profile: dependency-provenance
  arguments:
    target_ref: '{{ target.ref }}'
    control_id: DEVSEC-SUPPLYCHAIN-010
    rule_profile: dependency-provenance
    fail_closed: false
    redact_secrets: true
    collect_tool_version: true
    evidence_ref: findings/DEVSEC-SUPPLYCHAIN-010
- id: verify-evidence
  provider: evidence
  action: verify
  profile: deterministic-finding-bundle
  arguments:
    target_ref: '{{ target.ref }}'
    control_id: DEVSEC-SUPPLYCHAIN-010
    required_artifacts:
    - tool-version
    - scan-summary
    - sanitised-observations
    redact_secrets: true
evaluation:
  vulnerable_when:
  - control.dependency_provenance.status equals non_compliant
  - control.dependency_provenance.evidence_count is greater than zero
  - scanner.completed equals true and scanner.error_count equals zero
  secure_when:
  - control.dependency_provenance.status equals compliant
  - control.dependency_provenance.evidence_count equals zero
  - scanner.completed equals true and baseline.coverage_complete equals true
  inconclusive_when:
  - control.dependency_provenance.status equals unknown
  - scanner.completed equals false or scanner.error_count is greater than zero
  - baseline.coverage_complete equals false or required evidence is missing
outputs:
  title: Dependency Provenance control result
  severity: medium
  confidence: dynamic
