apiVersion: security.hex0r.io/v1alpha1
kind: SecurityRunbook
metadata:
  id: DEVSEC-SBOM-007
  name: Verify License Metadata
  version: 1.0.0
  status: experimental
  domain: devsecops
  category: sbom
  tags:
  - license-metadata
  - owasp-devsecops
  - sbom
  - typed-execution
selectors:
  target_types:
  - software-artifact
  capabilities:
  - artifact-read
  - sbom-parser
risk:
  intrusiveness: passive
  destructive: false
  production_safe: true
  max_actions: 5
  timeout_seconds: 180
steps:
- id: collect-baseline
  provider: repository
  action: inventory
  profile: sbom-baseline
  arguments:
    target_ref: '{{ target.ref }}'
    evidence_ref: baseline/DEVSEC-SBOM-007
    read_only: true
    redact_secrets: true
- id: execute-control
  provider: sbom
  action: verify
  profile: license-metadata
  arguments:
    target_ref: '{{ target.ref }}'
    control_id: DEVSEC-SBOM-007
    rule_profile: license-metadata
    fail_closed: false
    redact_secrets: true
    collect_tool_version: true
    evidence_ref: findings/DEVSEC-SBOM-007
- id: verify-evidence
  provider: evidence
  action: verify
  profile: deterministic-finding-bundle
  arguments:
    target_ref: '{{ target.ref }}'
    control_id: DEVSEC-SBOM-007
    required_artifacts:
    - tool-version
    - scan-summary
    - sanitised-observations
    redact_secrets: true
evaluation:
  vulnerable_when:
  - control.license_metadata.status equals non_compliant
  - control.license_metadata.evidence_count is greater than zero
  - scanner.completed equals true and scanner.error_count equals zero
  secure_when:
  - control.license_metadata.status equals compliant
  - control.license_metadata.evidence_count equals zero
  - scanner.completed equals true and baseline.coverage_complete equals true
  inconclusive_when:
  - control.license_metadata.status equals unknown
  - scanner.completed equals false or scanner.error_count is greater than zero
  - baseline.coverage_complete equals false or required evidence is missing
outputs:
  title: License Metadata control result
  severity: medium
  confidence: dynamic
