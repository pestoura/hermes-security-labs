apiVersion: security.hex0r.io/v1alpha1
kind: SecurityRunbook
metadata:
  id: DEVSEC-IAC-015
  name: Verify Cloudformation Public Resource
  version: 1.0.0
  status: experimental
  domain: devsecops
  category: iac
  tags:
  - cloudformation-public-resource
  - iac
  - owasp-devsecops
  - typed-execution
selectors:
  target_types:
  - iac-project
  capabilities:
  - iac-read
  - policy-engine
risk:
  intrusiveness: passive
  destructive: false
  production_safe: true
  max_actions: 5
  timeout_seconds: 300
steps:
- id: collect-baseline
  provider: repository
  action: inventory
  profile: iac-baseline
  arguments:
    target_ref: '{{ target.ref }}'
    evidence_ref: baseline/DEVSEC-IAC-015
    read_only: true
    redact_secrets: true
- id: execute-control
  provider: iac
  action: scan
  profile: cloudformation-public-resource
  arguments:
    target_ref: '{{ target.ref }}'
    control_id: DEVSEC-IAC-015
    rule_profile: cloudformation-public-resource
    fail_closed: false
    redact_secrets: true
    collect_tool_version: true
    evidence_ref: findings/DEVSEC-IAC-015
- id: verify-evidence
  provider: evidence
  action: verify
  profile: deterministic-finding-bundle
  arguments:
    target_ref: '{{ target.ref }}'
    control_id: DEVSEC-IAC-015
    required_artifacts:
    - tool-version
    - scan-summary
    - sanitised-observations
    redact_secrets: true
evaluation:
  vulnerable_when:
  - control.cloudformation_public_resource.status equals non_compliant
  - control.cloudformation_public_resource.evidence_count is greater than zero
  - scanner.completed equals true and scanner.error_count equals zero
  secure_when:
  - control.cloudformation_public_resource.status equals compliant
  - control.cloudformation_public_resource.evidence_count equals zero
  - scanner.completed equals true and baseline.coverage_complete equals true
  inconclusive_when:
  - control.cloudformation_public_resource.status equals unknown
  - scanner.completed equals false or scanner.error_count is greater than zero
  - baseline.coverage_complete equals false or required evidence is missing
outputs:
  title: Cloudformation Public Resource control result
  severity: high
  confidence: dynamic
