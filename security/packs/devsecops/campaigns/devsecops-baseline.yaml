apiVersion: security.hex0r.io/v1alpha1
kind: SecurityCampaign
metadata:
  id: devsecops-baseline
  name: DevSecOps baseline
  status: experimental
domain: devsecops
selectors:
  categories:
  - repository
  - secrets
  - sca
  - sbom
  - evidence
execution:
  mode: sequential
  max_parallel: 1
  stop_on_scope_violation: true
  stop_on_cleanup_failure: true
