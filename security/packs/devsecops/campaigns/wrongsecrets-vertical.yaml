apiVersion: security.hex0r.io/v1alpha1
kind: SecurityCampaign
metadata:
  id: wrongsecrets-vertical
  name: WrongSecrets secrets-management vertical
  status: candidate
domain: devsecops
description: >-
  Minimal measurable vertical for the OWASP WrongSecrets laboratory. The
  selection stays inside the secrets category so the campaign exercises the
  calibrated secrets/scan adapter end to end without pulling in categories the
  laboratory cannot answer.
selectors:
  categories:
  - secrets
laboratory:
  id: wrongsecrets
  binding: security/bindings/labs.yaml
  scope: laboratory
execution:
  mode: sequential
  max_parallel: 1
  stop_on_scope_violation: true
  stop_on_cleanup_failure: true
  require_evidence_redaction: true
evidence:
  redact_secrets: true
  store: external
  retention: campaign-scoped
