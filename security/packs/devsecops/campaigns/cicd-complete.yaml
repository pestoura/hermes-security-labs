apiVersion: security.hex0r.io/v1alpha1
kind: SecurityCampaign
metadata:
  id: cicd-complete
  name: CI/CD complete
  status: experimental
domain: devsecops
selectors:
  categories:
  - inventory
  - secrets
  - cicd
  - repository
execution:
  mode: sequential
  max_parallel: 1
  stop_on_scope_violation: true
  stop_on_cleanup_failure: true
