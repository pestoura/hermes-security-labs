  - id: SVP2-L-01
    title: Domain expansion to Kubernetes identity cloud mobile and IoT OT
    pillar: L
    priority: P2
    phase: 8
    status: proposed
    rationale: >-
      A expansao de dominio so e segura depois de existirem lifecycle isolamento
      evidencia e capacidades maduras nos dominios ja suportados.
    scope:
      - Kubernetes com kind ou k3d cluster unico kubeconfig efemero e cleanup
      - Identidade e Active Directory com drivers de VM ou hypervisor snapshots e budgets
      - Cloud sandboxes com credenciais efemeras budgets e TTL
      - Mobile com ADB APK e sidecar MobSF e ciclo de vida de dispositivo
      - IoT e OT com runtime externo ou hardware fronteiras USB simuladores e aprovacao humana
      - Declarar dependencias e constraints explicitas por dominio
    deliverables:
      - Especificacao dos requisitos e constraints por dominio de expansao
    dependencies: [SVP2-I-01, SVP2-D-02, SVP2-A-02]
    acceptance_criteria:
      - Nenhum dominio e ativado sem lifecycle de cleanup demonstrado
      - Credenciais de cloud sao efemeras e limitadas por budget e TTL
      - Interacao com hardware externo exige aprovacao humana explicita
    effort: XL
    risks:
      - Custo e disponibilidade de recursos externos
      - Hardware externo introduzir risco fisico e de dados
    labels: [roadmap, architecture, "pillar:L", "priority:P2", "impact:L4", "status:proposed", "type:epic"]
    references:
      - docs/roadmap/security-validation-platform-v2.md
