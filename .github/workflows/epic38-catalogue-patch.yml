name: epic38-catalogue-patch

on:
  push:
    branches:
      - docs/svp2-e01-semantic-chain-lifecycle-reconciliation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/svp2-e01-semantic-chain-lifecycle-reconciliation
          fetch-depth: 0
      - name: Apply exact EPIC-38 catalogue patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('roadmap/epics/security-validation-platform-v2-concepts.yaml')
          text = path.read_text(encoding='utf-8')
          old = '''  - concept_id: EPIC-38
              slug: cwe-capec-attack-semantic-chain
              title: "CWE/CAPEC/ATT&CK Semantic Chain"
              pillar: E
              phase: 5
              priority: P1
              status: intent
              umbrella_id: SVP2-E-01
              umbrella_issue: 86
              dependencies: [EPIC-36, EPIC-37]
              doc_path: docs/roadmap/epics/EPIC-38-cwe-capec-attack-semantic-chain.md
              current_state: "PR #146 provides generic provenance-aware relation derivation, but EPIC-38 remains INTENT: typed chain hops, deterministic resolution, first-class gaps, ambiguity handling and chain-quality policy remain NOT_IMPLEMENTED/NOT_RUN."
              target_state: "An explicit semantic chain resolving vulnerability to weakness to attack pattern to technique, with confidence at each hop."
          '''.replace('          ', '')
          new = '''  - concept_id: EPIC-38
              slug: cwe-capec-attack-semantic-chain
              title: "CWE/CAPEC/ATT&CK Semantic Chain"
              pillar: E
              phase: 5
              priority: P1
              status: implementing
              umbrella_id: SVP2-E-01
              umbrella_issue: 86
              dependencies: [EPIC-36, EPIC-37]
              doc_path: docs/roadmap/epics/EPIC-38-cwe-capec-attack-semantic-chain.md
              current_state: "IMPLEMENTING. PR #186 integrated the repository-level deterministic CVE->CWE->CAPEC->ATT&CK semantic-chain contract in main 54220a8c83402f8d8c36d3addbb293269a6f8a45: strict typed relation/chain schemas, canonical framework IDs, snapshot-bound deterministic relations, per-hop confidence/provenance/rationale, deterministic ordered resolution, first-class GAP and AMBIGUOUS states with no silent winner, duplicate semantic assertions fail closed, weakest-hop chain confidence, bounded inputs, and advisory-only non-executable outputs with execution_authority NONE. Authoritative external CWE/CAPEC/ATT&CK mapping acquisition remains NOT_RUN; mapping curation/approval remains NOT_IMPLEMENTED; mapping version synchronization/migration remains NOT_IMPLEMENTED/NOT_RUN; production graph persistence/query remains NOT_IMPLEMENTED; production campaign-planner consumption remains NOT_IMPLEMENTED/NOT_RUN; automatic planning inclusion remains NOT_IMPLEMENTED. Hermes/Control Plane remains the sole execution-authorization authority. AS_BUILT and FINAL are not claimed. NO_RUNTIME_CHANGE."
              target_state: "An explicit semantic chain resolving vulnerability to weakness to attack pattern to technique, with confidence at each hop."
          '''.replace('          ', '')
          if text.count(old) != 1:
              raise SystemExit('expected exact EPIC-38 block not found exactly once')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          test "$(git diff --numstat -- roadmap/epics/security-validation-platform-v2-concepts.yaml)" != ""
          additions=$(git diff --numstat -- roadmap/epics/security-validation-platform-v2-concepts.yaml | awk '{print $1}')
          deletions=$(git diff --numstat -- roadmap/epics/security-validation-platform-v2-concepts.yaml | awk '{print $2}')
          test "$additions" = "2"
          test "$deletions" = "2"
      - name: Self-remove helper and commit
        run: |
          git rm .github/workflows/epic38-catalogue-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add roadmap/epics/security-validation-platform-v2-concepts.yaml
          git commit -m "docs(svp2-e01): synchronize EPIC-38 lifecycle catalogue"
          git push origin HEAD:docs/svp2-e01-semantic-chain-lifecycle-reconciliation
