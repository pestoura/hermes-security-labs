name: Restore missing DevSecOps secret runbooks

on:
  push:
    branches:
      - feat/consolidate-security-platform
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/consolidate-security-platform
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore verified secret runbooks
        run: |
          set -euo pipefail
          cat > /tmp/secrets.b64 <<'PAYLOAD'
          
          PAYLOAD
          tr -d '[:space:]' < /tmp/secrets.b64 | base64 --decode > /tmp/secrets.tar.gz
          echo 'cb707c7ac4c2d98af92e0801c9510c29b57ce615e3d4e2735901eaeda075a526  /tmp/secrets.tar.gz' | sha256sum --check
          mkdir -p security/packs/devsecops/runbooks/secrets
          tar -xzf /tmp/secrets.tar.gz -C security/packs/devsecops/runbooks/secrets
          test "$(find security/packs/devsecops/runbooks/secrets -type f -name '*.yaml' | wc -l)" -eq 16
          test "$(find security/packs/devsecops/runbooks -type f -name '*.yaml' | wc -l)" -eq 120
          python -m pip install --disable-pip-version-check PyYAML jsonschema
          python security/tools/securityctl.py validate
      - name: Commit restored runbooks
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add security/packs/devsecops/runbooks/secrets
          git commit -m 'fix: restore DevSecOps secret runbooks'
          git push origin HEAD:feat/consolidate-security-platform
