name: Finalize SVP2-A-01 once v2

on:
  push:
    branches:
      - docs/finalize-svp2-a-01

permissions:
  contents: write

jobs:
  synchronize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/finalize-svp2-a-01
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply corrected lifecycle synchronization
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          original = Path('.github/workflows/finalize-svp2-a-01-once.yml')
          text = original.read_text(encoding='utf-8')
          script = text.split("          python - <<'PY'\n", 1)[1].split("\n          PY", 1)[0]
          namespace: dict[str, object] = {}
          exec(dedent(script), namespace)

          replace_once = namespace['replace_once']
          replace_once(
              'roadmap/tests/test_concept_catalogue.py',
              '''def test_all_statuses_are_intent_for_now(concepts: dict) -> None:
    for item in concepts["concept_epics"]:
        assert item["status"] == "intent", (
            f"{item['concept_id']} claims a non-intent status; update the epic document "
            "as-built section before changing this"
        )
''',
              '''def test_statuses_match_document_lifecycle(concepts: dict) -> None:
    for item in concepts["concept_epics"]:
        document = ROOT / item["doc_path"]
        text = document.read_text(encoding="utf-8")
        marker = item["status"].upper()
        assert f"**{marker}**" in text, (
            f"{item['concept_id']} catalogue status {item['status']!r} "
            "does not match its epic document"
        )
''',
          )

          Path('.github/workflows/finalize-svp2-a-01-once-v2.yml').unlink()
          PY

      - name: Validate synchronized catalogues
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -q pytest pyyaml jsonschema
          python -m pytest -q \
            roadmap/tests/test_backlog.py \
            roadmap/tests/test_concept_catalogue.py \
            docs/tests/test_epic_catalogue.py \
            docs/tests/test_documentation.py \
            docs/tests/test_architecture_contracts.py
          git diff --check

      - name: Commit synchronized closure
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(umbrella-76): synchronize FINAL lifecycle state"
          git push origin HEAD:docs/finalize-svp2-a-01
