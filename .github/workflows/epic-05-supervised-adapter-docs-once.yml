name: Apply EPIC-05 supervised adapter docs once

on:
  push:
    branches:
      - feat/epic-05-api-supervised-synthetic-adapter

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/epic-05-api-supervised-synthetic-adapter
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply exact declaration patch
        run: python tools/tmp_epic05_supervised_adapter_docs.py
      - name: Install validation dependencies and SDK
        run: python -m pip install --disable-pip-version-check -q pytest ruff -e platform/runner-protocol
      - name: Validate supervised adapter declaration
        env:
          PYTHONPATH: security/packs/api/src
        run: |
          python platform/runner-protocol/validate_protocol.py --contract-only
          python -m pytest -q \
            platform/runner-protocol/tests \
            security/packs/api/tests \
            roadmap/tests docs/tests \
            -p no:cacheprovider
          ruff check --config security/pyproject.toml \
            platform/runner-protocol \
            security/packs/api/src security/packs/api/tests \
            roadmap/tests docs/tests
          git diff --check
      - name: Commit validated declaration state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(epic-05): declare supervised synthetic API integration"
          git push origin HEAD:feat/epic-05-api-supervised-synthetic-adapter
