name: Apply EPIC-05 SDK patch once

on:
  push:
    branches:
      - refactor/epic-05-runner-protocol-sdk

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/epic-05-runner-protocol-sdk
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply exact SDK migration patch
        run: python tools/tmp_epic05_sdk_patch.py
      - name: Install SDK and validation dependencies
        run: python -m pip install --disable-pip-version-check -q pytest ruff -e platform/runner-protocol
      - name: Validate SDK extraction
        run: |
          python -c "import runner_protocol_v2; print(runner_protocol_v2.__version__)"
          python platform/runner-protocol/validate_protocol.py --contract-only
          python platform/runner-protocol/conformance.py --self-test
          python -m pytest -q platform/runner-protocol/tests -p no:cacheprovider
          python -m pytest -q roadmap/tests docs/tests -p no:cacheprovider
          ruff check --config security/pyproject.toml platform/runner-protocol docs/tests roadmap/tests
          git diff --check
      - name: Commit validated SDK migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(epic-05): migrate protocol consumers to SDK"
          git push origin HEAD:refactor/epic-05-runner-protocol-sdk
