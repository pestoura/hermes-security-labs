name: Integrate EPIC-05 contract fix once

on:
  push:
    branches:
      - feat/epic-05-runner-protocol-v2

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/epic-05-runner-protocol-v2
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Improve diagnostics and apply canonical patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          validator = Path("platform/runner-protocol/validate_protocol.py")
          text = validator.read_text(encoding="utf-8")
          old = (
              "def validate_schema(message: Mapping[str, Any]) -> None:\n"
              "    \"\"\"Validate one protocol message against the canonical schema bundle.\"\"\"\n"
              "    errors = sorted(_validator().iter_errors(message), key=lambda error: list(error.path))\n"
              "    if errors:\n"
              "        details = \"; \".join(\n"
              "            f\"{_format_path(error.absolute_path)}: {error.message}\" for error in errors\n"
              "        )\n"
              "        raise ProtocolValidationError(details)\n"
          )
          new = (
              "def _leaf_errors(\n"
              "    error: jsonschema.ValidationError,\n"
              ") -> Iterable[jsonschema.ValidationError]:\n"
              "    \"\"\"Yield actionable leaf errors instead of an opaque oneOf summary.\"\"\"\n"
              "    if error.context:\n"
              "        for child in error.context:\n"
              "            yield from _leaf_errors(child)\n"
              "        return\n"
              "    yield error\n\n\n"
              "def validate_schema(message: Mapping[str, Any]) -> None:\n"
              "    \"\"\"Validate one protocol message against the canonical schema bundle.\"\"\"\n"
              "    root_errors = _validator().iter_errors(message)\n"
              "    errors = [leaf for root in root_errors for leaf in _leaf_errors(root)]\n"
              "    if errors:\n"
              "        diagnostics = {\n"
              "            (_format_path(error.absolute_path), error.message) for error in errors\n"
              "        }\n"
              "        details = \"; \".join(\n"
              "            f\"{path}: {message}\" for path, message in sorted(diagnostics)\n"
              "        )\n"
              "        raise ProtocolValidationError(details)\n"
          )
          if text.count(old) != 1:
              raise SystemExit("validator diagnostic block did not match exactly once")
          validator.write_text(text.replace(old, new, 1), encoding="utf-8")

          original = Path(".github/workflows/epic-05-contract-once.yml")
          original_text = original.read_text(encoding="utf-8")
          script = original_text.split("          python - <<'PY'\n", 1)[1].split(
              "\n          PY", 1
          )[0]
          exec(dedent(script), {})

          Path(".github/workflows/epic-05-contract-fix-once.yml").unlink()
          PY

      - name: Validate EPIC-05 contract and lifecycle
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -q pytest pyyaml jsonschema ruff
          python platform/runner-protocol/validate_protocol.py --contract-only
          python -m pytest -q platform/runner-protocol/tests -p no:cacheprovider
          python -m pytest -q roadmap/tests docs/tests -p no:cacheprovider
          ruff check --config security/pyproject.toml \
            platform/runner-protocol/validate_protocol.py \
            platform/runner-protocol/tests
          git diff --check

      - name: Commit integrated contract block
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(epic-05): integrate Runner Protocol v2 contract"
          git push origin HEAD:feat/epic-05-runner-protocol-v2
