name: epic-05-devsecops-as-built-v3

on:
  push:
    branches:
      - docs/epic-05-devsecops-as-built

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic AS_BUILT documentation closure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          epic_path = Path("docs/roadmap/epics/EPIC-05-runner-protocol-v2.md")
          epic = epic_path.read_text(encoding="utf-8")
          epic = replace_once(epic, "| Document version | 1.9.0 |", "| Document version | 2.0.0 |", "epic version")

          old_status = (
              "cleanup. The API-family fixed-worker synthetic candidate was then integrated through pull\n"
              "request [#119](https://github.com/pestoura/hermes-security-labs/pull/119) and validated again on\n"
              "`main`. It consumes the ledger and supervisor, proving claim-before-spawn, timeout, asynchronous\n"
              "cancellation and fail-closed residue handling without real capabilities. `FINAL` remains false:\n"
              "production execution integration is `NOT_RUN`, promotion is blocked, DevSecOps and AI/MCP remain\n"
              "`NOT_RUN`, and no sandboxed real capability has been demonstrated.\n"
          )
          new_status = (
              "cleanup. The API-family fixed-worker synthetic candidate was then integrated through pull\n"
              "request [#119](https://github.com/pestoura/hermes-security-labs/pull/119) and validated again on\n"
              "`main`. It consumes the ledger and supervisor, proving claim-before-spawn, timeout, asynchronous\n"
              "cancellation and fail-closed residue handling without real capabilities. The shared supervised\n"
              "synthetic engine was subsequently reused by an isolated DevSecOps candidate through pull request\n"
              "[#121](https://github.com/pestoura/hermes-security-labs/pull/121), with its canonical compatibility\n"
              "declaration promoted atomically through pull request\n"
              "[#122](https://github.com/pestoura/hermes-security-labs/pull/122). API and DevSecOps now have\n"
              "fixed-worker synthetic process evidence only. `FINAL` remains false: production execution\n"
              "integration is `NOT_RUN`, promotion is blocked, AI/MCP remains `NOT_RUN`, and no sandboxed real\n"
              "capability has been demonstrated.\n"
          )
          epic = replace_once(epic, old_status, new_status, "epic current status")

          block9 = """### Block 9 — shared supervised engine and DevSecOps synthetic portability (`AS_BUILT`)

          - Technical branch: `feat/epic-05-devsecops-supervised-synthetic`
          - Technical pull request: [#121](https://github.com/pestoura/hermes-security-labs/pull/121)
          - Technical squash merge: `16384cdb4223b78da8ed26f8f2ad61038e7e5636`
          - Lifecycle branch: `chore/epic-05-devsecops-lifecycle`
          - Lifecycle pull request: [#122](https://github.com/pestoura/hermes-security-labs/pull/122)
          - Lifecycle validated head: `057ae3041989a6f57f9f4cc5d7f505042d7f9a30`
          - Lifecycle squash merge: `f2be46da70601aafe92a436636d8c09201a1b259`
          - Shared engine: `platform/runner-protocol/src/runner_protocol_v2/synthetic_supervised.py`
          - DevSecOps adapter: `security/packs/devsecops/src/devsecops_runbooks/supervised_runner_protocol_adapter.py`
          - DevSecOps worker: `security/packs/devsecops/src/devsecops_runbooks/synthetic_supervised_worker.py`
          - Activation: `--conformance-only --synthetic-process-only --durable-ledger <absolute-path>`
          - Scope: fixed synthetic worker modes only
          - Durable replay: completed outcomes do not start a second process
          - Cancellation and timeout: shared POSIX supervisor with bounded cleanup
          - Residue: fail-closed `INCONCLUSIVE`, never `PASS`
          - Output: hashes, lengths and bounded supervision metadata; no raw stdout/stderr
          - Compatibility status: `PASS_SYNTHETIC_PROCESS`
          - Sandbox status: `NOT_IMPLEMENTED`
          - Production DevSecOps execution: `NOT_RUN`
          - Promotion status: blocked
          - Runtime declaration: `NO_RUNTIME_CHANGE`

          The merged block proves that the repository-owned supervisor and durable lifecycle can be reused
          across runner families without creating an API-to-DevSecOps dependency or copying the engine. It
          does not run scanners, pipelines, repositories, networks, customer targets or commands supplied by
          requests. The lifecycle declaration remains constrained to the fixed synthetic worker boundary.

          """.replace("          ", "")
          epic = replace_once(epic, "## 15. As-built / final architecture\n", block9 + "## 15. As-built / final architecture\n", "block 9 insertion")
          epic = replace_once(
              epic,
              "  SUP --> SAPI[API fixed-worker supervised candidate]\n  SAPI --> LEDGER\n  SAPI -. no production capability .-> RUN\n",
              "  SUP --> SAPI[API fixed-worker supervised candidate]\n  SUP --> SDEV[DevSecOps fixed-worker supervised candidate]\n  SAPI --> LEDGER\n  SDEV --> LEDGER\n  SAPI -. no production capability .-> RUN\n  SDEV -. no production capability .-> RUN\n",
              "as-built diagram",
          )
          epic = replace_once(
              epic,
              "fixed-worker synthetic API candidate dispatches controlled repository test processes through the\nsupervisor. No production adapter, network, container, laboratory or customer target is used.\n",
              "fixed-worker synthetic API and DevSecOps candidates dispatch controlled repository test processes\nthrough the shared supervisor. No production adapter, network, container, laboratory or customer\ntarget is used.\n",
              "as-built architecture description",
          )
          evidence_marker = "| Sandbox status | `NOT_IMPLEMENTED` |\n"
          evidence_rows = """| PR #121 technical squash merge | `16384cdb4223b78da8ed26f8f2ad61038e7e5636` |
          | PR #122 lifecycle validated head | `057ae3041989a6f57f9f4cc5d7f505042d7f9a30` |
          | PR #122 lifecycle squash merge | `f2be46da70601aafe92a436636d8c09201a1b259` |
          | PR #122 validate workflow | success — run `31110205273` |
          | PR #122 security/gitleaks workflow | success — run `31110206988` |
          | Post-merge DevSecOps lifecycle validate workflow | success — run `31110364765` |
          | Post-merge DevSecOps lifecycle security/gitleaks workflow | success — run `31110364958` |
          | DevSecOps compatibility state | `PASS_SYNTHETIC_PROCESS` |
          | Production DevSecOps execution integration | `NOT_RUN` |
          | AI/MCP execution integration | `NOT_RUN` |
          """.replace("          ", "")
          epic = replace_once(epic, evidence_marker, evidence_marker + evidence_rows, "DevSecOps evidence rows")
          epic = replace_once(epic, "| Real runner conformance | `NOT_RUN` | API, DevSecOps and AI/MCP remain unchanged |", "| Real runner conformance | `NOT_RUN` | API and DevSecOps have synthetic candidates only; AI/MCP remains unchanged |", "block 2 real conformance")
          epic = replace_once(epic, "| Real runner conformance | `NOT_RUN` | API, DevSecOps and AI/MCP unchanged |", "| Real runner conformance | `NOT_RUN` | API and DevSecOps have synthetic candidates only; AI/MCP remains unchanged |", "block 3 real conformance")

          block9_acceptance = """### Block 9 acceptance assessment

          | Criterion | Result | Evidence |
          | --- | --- | --- |
          | Shared engine has no family-specific imports | met | source boundary and monorepo tests |
          | DevSecOps does not depend on API implementation | met | isolated wrapper and import guards |
          | Request input cannot form process specification | met | caller-shaped input and source tests |
          | Durable claim precedes fixed-worker process creation | met | shared lifecycle tests |
          | Completed request replays without a second process | met | reopen/replay tests and zero effect count |
          | Non-zero exit, timeout and cancellation normalize safely | met | DevSecOps pack tests |
          | Descendant residue cannot yield `PASS` | met | residue maps to non-retryable `INCONCLUSIVE` |
          | Raw worker streams are not persisted | met | hashes and bounded metadata only |
          | Real scanners, pipelines and repositories are refused | met | refusal-before-claim tests |
          | Canonical matrix and validator agree atomically | met | PR #122 compatibility validation |
          | Sandbox and resource isolation | `NOT_RUN` | process groups are not a sandbox |
          | Production DevSecOps capability execution | `NOT_RUN` | fixed synthetic worker only |
          | Production promotion | blocked | explicit compatibility declaration |

          """.replace("          ", "")
          epic = replace_once(epic, "### Epic-level criteria not yet met\n", block9_acceptance + "### Epic-level criteria not yet met\n", "block 9 acceptance insertion")
          epic = replace_once(epic, "| Correlation propagated by every adapter | `NOT_RUN` | API, DevSecOps and AI/MCP adapter conformance |", "| Correlation propagated by every adapter | `PARTIAL` | API and DevSecOps synthetic candidates preserve correlation; production adapters and AI/MCP remain `NOT_RUN` |", "epic correlation state")
          epic = replace_once(epic, "| Cancellation observable and bounded live | `PARTIAL` | fixed synthetic API process is AS_BUILT; production adapter cancellation remains `NOT_RUN` |", "| Cancellation observable and bounded live | `PARTIAL` | fixed synthetic API and DevSecOps processes are AS_BUILT; production adapter cancellation remains `NOT_RUN` |", "epic cancellation state")
          epic = replace_once(epic, "| Error taxonomy normalized end to end | `PARTIAL` | fixed synthetic process states are normalized; gateway and production adapters remain `NOT_RUN` |", "| Error taxonomy normalized end to end | `PARTIAL` | API and DevSecOps synthetic process states are normalized; gateway and production adapters remain `NOT_RUN` |", "epic error state")

          old_difference = (
              "  Block 8 then connected only a fixed synthetic worker; real capability mapping still requires\n"
              "  stronger sandbox, authorization, target and evidence controls.\n"
          )
          new_difference = (
              "  Block 8 then connected only a fixed API synthetic worker. Block 9 extracted the common lifecycle\n"
              "  and reused it through an isolated DevSecOps wrapper; real capability mapping still requires stronger\n"
              "  sandbox, authorization, target and evidence controls.\n"
          )
          epic = replace_once(epic, old_difference, new_difference, "differences from intent")
          epic = replace_once(
              epic,
              "- No production runner adapter consumes or emits Runner Protocol v2 messages; the API\n  candidate is limited to synthetic conformance and cannot execute real capabilities.\n",
              "- No production runner adapter consumes or emits Runner Protocol v2 messages; the API and\n  DevSecOps candidates are limited to synthetic conformance and cannot execute real capabilities.\n",
              "production adapter limitation",
          )
          epic = replace_once(
              epic,
              "- Local cancellation, hard timeout and process-group cleanup are integrated with the fixed\n  synthetic API candidate, but no production Runner Protocol adapter invokes the supervisor or\n  executes a real capability.\n",
              "- Local cancellation, hard timeout and process-group cleanup are integrated with the fixed\n  synthetic API and DevSecOps candidates, but no production Runner Protocol adapter invokes the\n  supervisor or executes a real capability.\n",
              "supervision limitation",
          )
          epic = replace_once(epic, "| 2026-08-06 | 1.9.0 | Record fixed-worker API supervised synthetic-process integration AS_BUILT with sandbox and production execution NOT_RUN. |\n", "| 2026-08-06 | 1.9.0 | Record fixed-worker API supervised synthetic-process integration AS_BUILT with sandbox and production execution NOT_RUN. |\n| 2026-08-06 | 2.0.0 | Record shared supervised engine and DevSecOps fixed-worker synthetic portability AS_BUILT with production execution NOT_RUN. |\n", "epic change log")
          epic_path.write_text(epic, encoding="utf-8")

          platform_path = Path("platform/runner-protocol/README.md")
          platform = platform_path.read_text(encoding="utf-8")
          platform = replace_once(platform, "- Current implementation state: contract, repository-local SDK, vendor-neutral conformance kit, durable transactional idempotency ledger and POSIX process supervisor are available; API-family in-memory and durable candidates pass synthetic conformance, and a fixed-worker supervised candidate is `AS_BUILT` with `PASS_SYNTHETIC_PROCESS`; real execution for API, DevSecOps and AI/MCP remains unimplemented.", "- Current implementation state: contract, repository-local SDK, vendor-neutral conformance kit, durable transactional idempotency ledger and POSIX process supervisor are available; API-family in-memory and durable candidates pass synthetic conformance, while fixed-worker API and DevSecOps supervised candidates are `AS_BUILT` with `PASS_SYNTHETIC_PROCESS`; production execution remains unimplemented for every family and AI/MCP has no candidate.", "platform lifecycle state")
          platform = replace_once(platform, "authorize, select capabilities, map targets or produce protocol evidence. Only the fixed-worker\nsynthetic-process candidate consumes it; no production adapter does. The SDK remains the shared\ndependency so protocol and lifecycle semantics are not copied per family.", "authorize, select capabilities, map targets or produce protocol evidence. Only the fixed-worker\nAPI and DevSecOps synthetic-process candidates consume it; no production adapter does. The SDK\nremains the shared dependency so protocol and lifecycle semantics are not copied per family.", "shared SDK consumers")
          platform = replace_once(platform, "This is not a sandbox. It provides no cgroup, namespace, seccomp, network, privilege or resource\nquota enforcement. The API fixed-worker synthetic candidate exercises it without accepting a\ncaller-controlled command; no production adapter consumes it and real capability execution remains\n`NOT_RUN`.\n", "This is not a sandbox. It provides no cgroup, namespace, seccomp, network, privilege or resource\nquota enforcement. The API and DevSecOps fixed-worker synthetic candidates exercise it without\naccepting a caller-controlled command; no production adapter consumes it and real capability\nexecution remains `NOT_RUN`.\n", "supervised boundary consumers")
          devsecops_section = """### DevSecOps supervised synthetic-process candidate

          The block-9 candidate is implemented at
          [`security/packs/devsecops/src/devsecops_runbooks/supervised_runner_protocol_adapter.py`](../../security/packs/devsecops/src/devsecops_runbooks/supervised_runner_protocol_adapter.py)
          and documented in
          [`security/packs/devsecops/docs/runner-protocol-supervised-candidate.md`](../../security/packs/devsecops/docs/runner-protocol-supervised-candidate.md).
          It uses the same shared supervised engine and fixed activation controls as the API candidate, but
          supplies a separate DevSecOps worker and imports no API-family implementation. It cannot invoke a
          scanner, pipeline, repository, network, target or command supplied by a request.

          Its compatibility state is `PASS_SYNTHETIC_PROCESS` for fixed synthetic process evidence only.
          Sandboxing, production authorization, repository credentials, pipeline integration, real DevSecOps
          capability execution and Evidence Plane integration remain `NOT_RUN`; promotion remains blocked.

          """.replace("          ", "")
          platform = replace_once(platform, "## Conformance kit\n", devsecops_section + "## Conformance kit\n", "DevSecOps platform section")
          platform = replace_once(platform, "- API remains `conformance_only`; DevSecOps and AI/MCP remain `contract_only` until adapters and conformance evidence are integrated.", "- API and DevSecOps remain `conformance_only` with synthetic evidence only; AI/MCP remains `contract_only` until an adapter and conformance evidence are integrated.", "compatibility family status")
          platform_path.write_text(platform, encoding="utf-8")

          architecture_path = Path("docs/architecture/contracts/README.md")
          architecture = architecture_path.read_text(encoding="utf-8")
          architecture = replace_once(architecture, "| Runner dispatch and result | internal execution boundary | Runner Protocol owner / `SVP2-B-02` | gateway → runner → gateway | Runner Protocol v2 (`EPIC-05`) | contract, conformance-kit, SDK, durable ledger, POSIX process supervisor and fixed-worker API supervised candidate `AS_BUILT`; API protocol status `PASS_SYNTHETIC` / `PASS_SYNTHETIC_PROCESS`; sandbox, production execution and other adapters `NOT_RUN`; [`platform/runner-protocol/`](../../../platform/runner-protocol/README.md) | missing correlation, incompatibility, timeout, cancellation or verified cleanup is a normalized non-success outcome |", "| Runner dispatch and result | internal execution boundary | Runner Protocol owner / `SVP2-B-02` | gateway → runner → gateway | Runner Protocol v2 (`EPIC-05`) | contract, conformance-kit, SDK, durable ledger, POSIX process supervisor and fixed-worker API/DevSecOps supervised candidates `AS_BUILT`; API and DevSecOps status `PASS_SYNTHETIC_PROCESS`; sandbox, all production execution and AI/MCP adapter `NOT_RUN`; [`platform/runner-protocol/`](../../../platform/runner-protocol/README.md) | missing correlation, incompatibility, timeout, cancellation or verified cleanup is a normalized non-success outcome |", "contract inventory row")
          architecture_path.write_text(architecture, encoding="utf-8")

          catalogue_path = Path("roadmap/epics/security-validation-platform-v2-concepts.yaml")
          catalogue = catalogue_path.read_text(encoding="utf-8")
          catalogue = replace_once(catalogue, '    current_state: "AS_BUILT for contract, conformance-kit, SDK, durable ledger, API in-memory candidate, API durable synthetic restart replay, POSIX process supervisor and fixed-worker API supervised synthetic-process integration. Supervised status is PASS_SYNTHETIC_PROCESS; sandbox and production execution remain NOT_RUN, promotion blocked, and DevSecOps/AI-MCP NOT_RUN."', '    current_state: "AS_BUILT for contract, conformance-kit, SDK, durable ledger, API in-memory candidate, API durable synthetic restart replay, POSIX process supervisor, shared supervised engine and fixed-worker API/DevSecOps synthetic-process integrations. API and DevSecOps status is PASS_SYNTHETIC_PROCESS; sandbox and all production execution remain NOT_RUN, promotion blocked, and AI-MCP NOT_RUN."', "concept catalogue current state")
          catalogue_path.write_text(catalogue, encoding="utf-8")

          devsecops_doc = Path("security/packs/devsecops/docs/runner-protocol-supervised-candidate.md")
          devsecops_doc.write_text("""# DevSecOps Runner Protocol supervised synthetic-process candidate

          ## Status

          `AS_BUILT` — block 9 of `EPIC-05 — Runner Protocol v2`, delivered through technical
          pull request [#121](https://github.com/pestoura/hermes-security-labs/pull/121) and
          promoted canonically through lifecycle pull request
          [#122](https://github.com/pestoura/hermes-security-labs/pull/122).

          The candidate reuses the repository-owned supervised synthetic engine, durable SQLite
          idempotency ledger and POSIX process supervisor with a separate fixed DevSecOps worker.
          It is not a production DevSecOps runner, does not authorize work and cannot invoke a
          scanner, pipeline, repository, network, customer target or request-supplied command.

          ## Activation

          The adapter is:

          ```text
          security/packs/devsecops/src/devsecops_runbooks/supervised_runner_protocol_adapter.py
          ```

          It starts only with:

          ```text
          --conformance-only --synthetic-process-only --durable-ledger /absolute/path/outside/repository.sqlite3
          ```

          Request input cannot select the executable, arguments, working directory, environment or
          worker mode. Only synthetic `conformance.process.*` capabilities and the test authorization
          reference `authz/conformance/active` are accepted.

          ## Shared boundary and family isolation

          The lifecycle engine is implemented in
          `platform/runner-protocol/src/runner_protocol_v2/synthetic_supervised.py`. The DevSecOps
          wrapper supplies only its family identifier and fixed worker path. The shared engine imports
          no API or DevSecOps package, and the DevSecOps wrapper imports no API implementation.

          The fixed execution chain is:

          ```text
          absolute Python interpreter
            -> security/packs/devsecops/src/devsecops_runbooks/synthetic_supervised_worker.py
            -> one allowlisted synthetic mode
          ```

          ## Safety and durable semantics

          - a durable claim is created before process start;
          - completed requests replay after restart without a second process;
          - changed effects under the same key are refused;
          - uncertain active claims are not automatically reclaimed;
          - hard timeout and asynchronous cancellation use bounded process-group cleanup;
          - surviving descendants yield `INCONCLUSIVE`, never `PASS`;
          - raw stdout and stderr are replaced by hashes, lengths and bounded metadata;
          - real capabilities and customer authorization references are refused before claim;
          - shutdown waits for tracked synthetic processes to reach terminal cleanup.

          ## Integrated evidence

          - Technical merge: `16384cdb4223b78da8ed26f8f2ad61038e7e5636`
          - Lifecycle validated head: `057ae3041989a6f57f9f4cc5d7f505042d7f9a30`
          - Lifecycle merge: `f2be46da70601aafe92a436636d8c09201a1b259`
          - PR validate: `31110205273` — success
          - PR security/gitleaks: `31110206988` — success
          - Post-merge validate: `31110364765` — success
          - Post-merge security/gitleaks: `31110364958` — success
          - Compatibility: `PASS_SYNTHETIC_PROCESS`
          - Runtime declaration: `NO_RUNTIME_CHANGE`

          ## Explicit limitations

          - no production DevSecOps capability mapping;
          - no scanner, CI/CD platform, source repository or credential integration;
          - no container, namespace, cgroup, seccomp or network sandbox;
          - no privilege drop, service account or resource quotas;
          - no real authorization lookup, target allowlist or Rules of Engagement enforcement;
          - no Evidence Plane integration or chain of custody;
          - no automatic reconciliation of abandoned `IN_PROGRESS` effects;
          - no production promotion claim;
          - AI/MCP remains `NOT_RUN`.

          Production execution remains `NOT_RUN`, sandbox status remains `NOT_IMPLEMENTED`, and
          promotion remains blocked.

          `NO_RUNTIME_CHANGE`
          """.replace("          ", ""), encoding="utf-8")
          PY
          git diff --check
      - name: Commit final documentation atomically
        shell: bash
        run: |
          rm -f .github/workflows/epic-05-devsecops-as-built-patch.yml
          rm -f .github/workflows/epic-05-devsecops-as-built-v3.yml
          git config user.name "Pedro"
          git config user.email "pedro.estoura@gmail.com"
          git add -A
          git commit -m "docs(epic-05): record DevSecOps synthetic portability as-built"
          git push origin HEAD:docs/epic-05-devsecops-as-built
