name: epic44-quality-hardening-patch

on:
  push:
    branches:
      - feat/svp2-e02-knowledge-quality-curation-contract

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/svp2-e02-knowledge-quality-curation-contract
          fetch-depth: 0

      - name: Bind curation case id to canonical content
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("platform/knowledge-fabric/knowledge_quality.py")
          text = path.read_text(encoding="utf-8")
          old = '''    if not isinstance(case.get("knowledge_snapshot_id"), str) or not SNAPSHOT_ID_RE.fullmatch(case["knowledge_snapshot_id"]):
        raise KnowledgeQualityError("invalid curation snapshot id")
    candidates = case.get("candidate_source_record_ids")
    if (
        not isinstance(candidates, list)
        or not candidates
        or len(candidates) > MAX_CANDIDATES
        or len(set(candidates)) != len(candidates)
        or any(not isinstance(item, str) or not RECORD_ID_RE.fullmatch(item) for item in candidates)
    ):
        raise KnowledgeQualityError("invalid curation candidates")
    return dict(case)
'''
          new = '''    if not isinstance(case.get("knowledge_snapshot_id"), str) or not SNAPSHOT_ID_RE.fullmatch(case["knowledge_snapshot_id"]):
        raise KnowledgeQualityError("invalid curation snapshot id")
    if case.get("finding_type") not in {"CONFLICT", "LOW_CONFIDENCE", "STALE", "INCOMPLETE"}:
        raise KnowledgeQualityError("unsupported curation finding type")
    if not isinstance(case.get("subject_ref"), str) or not case["subject_ref"]:
        raise KnowledgeQualityError("curation subject is required")
    if not isinstance(case.get("rationale"), str) or not case["rationale"].strip():
        raise KnowledgeQualityError("curation rationale is required")
    candidates = case.get("candidate_source_record_ids")
    if (
        not isinstance(candidates, list)
        or not candidates
        or len(candidates) > MAX_CANDIDATES
        or len(set(candidates)) != len(candidates)
        or any(not isinstance(item, str) or not RECORD_ID_RE.fullmatch(item) for item in candidates)
    ):
        raise KnowledgeQualityError("invalid curation candidates")
    seed = {
        "knowledge_snapshot_id": case["knowledge_snapshot_id"],
        "finding_type": case["finding_type"],
        "subject_ref": case["subject_ref"],
        "candidate_source_record_ids": sorted(candidates),
        "rationale": case["rationale"].strip(),
    }
    if case_id != f"kqcase_{_digest(seed)[:32]}":
        raise KnowledgeQualityError("curation case id does not match canonical content")
    return dict(case)
'''
          if text.count(old) != 1:
              raise SystemExit("patch target must exist exactly once")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          git diff --check

      - name: Commit patch and remove helper
        shell: bash
        run: |
          git rm .github/workflows/epic44-quality-hardening-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform/knowledge-fabric/knowledge_quality.py
          git commit -m "fix(svp2-e02): bind curation case identity"
          git push origin HEAD:feat/svp2-e02-knowledge-quality-curation-contract
