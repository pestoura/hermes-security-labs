name: epic39-catalogue-patch

on:
  push:
    branches:
      - docs/svp2-e01-attack-sync-lifecycle-reconciliation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/svp2-e01-attack-sync-lifecycle-reconciliation
          fetch-depth: 0
      - name: Apply exact EPIC-39 catalogue patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('roadmap/epics/security-validation-platform-v2-concepts.yaml')
          text = path.read_text(encoding='utf-8')
          old = '''  - concept_id: EPIC-39
              slug: attack-synchronization-service
              title: "ATT&CK Synchronization Service"
              pillar: E
              phase: 5
              priority: P1
              status: intent
              umbrella_id: SVP2-E-01
              umbrella_issue: 86
              dependencies: [EPIC-36]
              doc_path: docs/roadmap/epics/EPIC-39-attack-synchronization-service.md
              current_state: "PR #146 provides ATT&CK entity/provenance support, but EPIC-39 remains INTENT: TAXII/external synchronization, version adoption, deprecation/rename handling, migration reports and mapping impact analysis remain NOT_IMPLEMENTED/NOT_RUN."
              target_state: "A managed synchronization process for ATT&CK content with version pinning, deprecation handling and migration reporting."
          '''.replace('          ', '')
          new = '''  - concept_id: EPIC-39
              slug: attack-synchronization-service
              title: "ATT&CK Synchronization Service"
              pillar: E
              phase: 5
              priority: P1
              status: implementing
              umbrella_id: SVP2-E-01
              umbrella_issue: 86
              dependencies: [EPIC-36]
              doc_path: docs/roadmap/epics/EPIC-39-attack-synchronization-service.md
              current_state: "IMPLEMENTING. PR #188 integrated the repository-level ATT&CK supplied-snapshot version/migration contract in main a702fd70a7a6bc65653cfde270ca8de0b48a2460: strict supplied-dataset and migration-report schemas, deterministic dataset identity, canonical ATT&CK/STIX identifiers, replacement validation with cycle refusal, strictly-newer same-domain migration preconditions, deterministic added/removed/renamed/revoked/deprecated/replaced/object-id-change reporting, source-dataset-bound mapping impact analysis, review-only affected mappings, blocking findings, automatic_adoption false, historical_rewrite false, external_sync NOT_PERFORMED and execution_authority NONE. TAXII/external ATT&CK synchronization remains NOT_RUN; upstream source provenance/signature verification remains NOT_IMPLEMENTED/NOT_RUN; scheduled synchronization/release polling and automatic version adoption remain NOT_IMPLEMENTED; production migration/adoption and graph/planner consumption remain NOT_IMPLEMENTED/NOT_RUN. Supplied snapshots are not claimed authoritative/current solely because they validate structurally. Hermes/Control Plane remains the sole execution-authorization authority. AS_BUILT and FINAL are not claimed. NO_RUNTIME_CHANGE."
              target_state: "A managed synchronization process for ATT&CK content with version pinning, deprecation handling and migration reporting."
          '''.replace('          ', '')
          if text.count(old) != 1:
              raise SystemExit('expected exact EPIC-39 block not found exactly once')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          additions=$(git diff --numstat -- roadmap/epics/security-validation-platform-v2-concepts.yaml | awk '{print $1}')
          deletions=$(git diff --numstat -- roadmap/epics/security-validation-platform-v2-concepts.yaml | awk '{print $2}')
          test "$additions" = "2"
          test "$deletions" = "2"
      - name: Self-remove helper and commit
        run: |
          git rm .github/workflows/epic39-catalogue-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add roadmap/epics/security-validation-platform-v2-concepts.yaml
          git commit -m "docs(svp2-e01): synchronize EPIC-39 lifecycle catalogue"
          git push origin HEAD:docs/svp2-e01-attack-sync-lifecycle-reconciliation
