name: Finalize SVP2-A-01 once

on:
  push:
    branches:
      - docs/finalize-svp2-a-01

permissions:
  contents: write

jobs:
  synchronize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/finalize-svp2-a-01
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Synchronize final lifecycle state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence, found {count}: {old!r}")
              file_path.write_text(text.replace(old, new, 1), encoding="utf-8")

          def replace_in_section(path: str, start: str, end: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              start_at = text.index(start)
              end_at = text.index(end, start_at + len(start))
              section = text[start_at:end_at]
              count = section.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{path}: section {start.strip()!r} expected one occurrence, "
                      f"found {count}: {old!r}"
                  )
              section = section.replace(old, new, 1)
              file_path.write_text(text[:start_at] + section + text[end_at:], encoding="utf-8")

          epic1 = "docs/roadmap/epics/EPIC-01-architecture-and-canonical-contracts.md"
          replace_once(epic1, "| Document version | 1.2.0 |", "| Document version | 1.3.0 |")
          replace_once(
              epic1,
              "**AS_BUILT** — the canonical architecture contract block was integrated through pull request\n"
              "[#100](https://github.com/pestoura/hermes-security-labs/pull/100) and validated again on\n"
              "`main`. The documentation now records what was delivered and the limits of the block.\n"
              "`FINAL` remains pending because delivery umbrella #76 also contains EPIC-02.",
              "**FINAL** — the canonical architecture contract block and the runtime source-of-truth\n"
              "contract covered by umbrella #76 are integrated, validated on `main`, synchronized with\n"
              "the machine-readable catalogues and closed as the completed SVP2-A-01 foundation.",
          )
          replace_once(epic1, "| FINAL | no |", "| FINAL | yes |")
          replace_once(
              epic1,
              "> Reserved lifecycle section. This section records the implementation integrated in `main`.\n"
              "> It is AS_BUILT evidence for EPIC-01; FINAL remains pending until umbrella #76 is closed.",
              "> Reserved lifecycle section. This section records the implementation integrated in `main`\n"
              "> and is the FINAL architecture record for EPIC-01 under umbrella #76.",
          )
          replace_once(
              epic1,
              "- EPIC-02 must still define the runtime source-of-truth and drift contract before umbrella\n"
              "  #76 can become FINAL.\n"
              "- The machine-readable concept catalogue remains at its pre-closure lifecycle value; it will\n"
              "  be updated with the catalogue and umbrella state during the FINAL transition required by\n"
              "  the documentation lifecycle contract.",
              "- Runtime enforcement of the contracts remains assigned to later gateway, runner and\n"
              "  laboratory lifecycle epics.\n"
              "- The FINAL transition synchronizes the concept catalogue and delivery umbrella state; it\n"
              "  does not claim implementation of later runtime capabilities.",
          )
          replace_once(
              epic1,
              "| 2026-08-06 | 1.2.0 | Record AS_BUILT architecture, merge/CI evidence, acceptance results, divergences and limitations. |",
              "| 2026-08-06 | 1.2.0 | Record AS_BUILT architecture, merge/CI evidence, acceptance results, divergences and limitations. |\n"
              "| 2026-08-06 | 1.3.0 | Mark FINAL after EPIC-02 completion, catalogue synchronization and umbrella closure validation. |",
          )

          epic2 = "docs/roadmap/epics/EPIC-02-single-source-of-truth-for-runtime.md"
          replace_once(epic2, "| Document version | 1.2.1 |", "| Document version | 1.3.0 |")
          replace_once(
              epic2,
              "**AS_BUILT** — the source-of-truth implementation was integrated through pull request\n"
              "[#102](https://github.com/pestoura/hermes-security-labs/pull/102) and validated again on\n"
              "`main`. `FINAL` remains pending until umbrella #76 completes its catalogue and lifecycle\n"
              "closure.",
              "**FINAL** — the source-of-truth implementation is integrated and validated on `main`;\n"
              "EPIC-01 and EPIC-02 are synchronized with the machine-readable catalogues and umbrella\n"
              "#76 is ready for completed closure.",
          )
          replace_once(epic2, "| FINAL | no |", "| FINAL | yes |")
          replace_once(
              epic2,
              "- Automatic drift remediation remains forbidden.",
              "- Automatic drift remediation remains forbidden.\n"
              "- FINAL records completion of the repository contract and catalogue synchronization only;\n"
              "  it does not claim live runtime reconciliation or image promotion.",
          )
          replace_once(
              epic2,
              "| 2026-08-06 | 1.2.1 | Retain the reserved lifecycle marker required by the epic documentation contract. |",
              "| 2026-08-06 | 1.2.1 | Retain the reserved lifecycle marker required by the epic documentation contract. |\n"
              "| 2026-08-06 | 1.3.0 | Mark FINAL after catalogue synchronization and umbrella closure validation. |",
          )

          concepts = "roadmap/epics/security-validation-platform-v2-concepts.yaml"
          replace_in_section(
              concepts,
              "  - concept_id: EPIC-01\n",
              "  - concept_id: EPIC-02\n",
              "    status: intent\n",
              "    status: final\n",
          )
          replace_in_section(
              concepts,
              "  - concept_id: EPIC-01\n",
              "  - concept_id: EPIC-02\n",
              '    current_state: "Not implemented. Concept documented as intent only."\n',
              '    current_state: "FINAL. Canonical trust boundaries, ADR governance and cross-plane contract inventory are integrated and CI-enforced; runtime enforcement remains assigned to later epics."\n',
          )
          replace_in_section(
              concepts,
              "  - concept_id: EPIC-02\n",
              "  - concept_id: EPIC-03\n",
              "    status: intent\n",
              "    status: final\n",
          )
          replace_in_section(
              concepts,
              "  - concept_id: EPIC-02\n",
              "  - concept_id: EPIC-03\n",
              '    current_state: "Not implemented. Concept documented as intent only."\n',
              '    current_state: "FINAL. The registry-backed runtime source-of-truth, schema validation and fail-safe tri-state drift contract are integrated; live reconciliation remains intentionally out of scope."\n',
          )

          backlog = "roadmap/epics/security-validation-platform-v2.yaml"
          replace_in_section(
              backlog,
              "  - id: SVP2-A-01\n",
              "  - id: SVP2-A-02\n",
              "    status: proposed\n",
              "    status: completed\n",
          )
          replace_in_section(
              backlog,
              "  - id: SVP2-A-01\n",
              "  - id: SVP2-A-02\n",
              '"status:proposed"',
              '"status:completed"',
          )

          replace_once(
              "schemas/backlog-epic.schema.json",
              '"status": { "type": "string", "enum": ["proposed"] }',
              '"status": { "type": "string", "enum": ["proposed", "implementing", "completed"] }',
          )
          replace_once(
              "roadmap/tests/test_backlog.py",
              '        assert "status:proposed" in labels\n',
              '        assert f"status:{epic[\'status\']}" in labels\n',
          )

          catalogue = "docs/roadmap/epic-catalogue-45.md"
          replace_once(
              catalogue,
              "> **Status: INTENT.** Nothing in this catalogue is implemented. It documents the\n"
              "> conceptual design space discussed for the platform. The delivery backlog remains the\n"
              "> 21 umbrella epics in",
              "> **Status: MIXED LIFECYCLE.** EPIC-01 and EPIC-02 are `FINAL` under completed umbrella\n"
              "> `SVP2-A-01`; the remaining concept epics retain their declared lifecycle state. This\n"
              "> catalogue records both implemented foundation contracts and the remaining design intent.\n"
              "> The delivery backlog remains the 21 umbrella epics in",
          )

          workflow = Path(".github/workflows/finalize-svp2-a-01-once.yml")
          workflow.unlink()
          PY

      - name: Validate synchronized catalogues
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -q pytest pyyaml jsonschema
          python -m pytest -q \
            roadmap/tests/test_backlog.py \
            roadmap/tests/test_concept_catalogue.py \
            docs/tests/test_epic_catalogue.py \
            docs/tests/test_documentation.py \
            docs/tests/test_architecture_contracts.py
          git diff --check

      - name: Commit synchronized closure
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(umbrella-76): synchronize FINAL lifecycle state"
          git push origin HEAD:docs/finalize-svp2-a-01
