name: epic40-test-guard-fix

on:
  push:
    branches:
      - feat/svp2-e02-nist-control-knowledge-layer

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/svp2-e02-nist-control-knowledge-layer
      - name: Correct exact regression assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('platform/tests/test_control_knowledge.py')
          text = path.read_text(encoding='utf-8')
          old = '    assert "PASS" not in json.dumps(projection)\n'
          new = '    assert "PASS" not in ctrl.PROJECTION_STATES\n'
          if text.count(old) != 1:
              raise SystemExit('expected assertion not found exactly once')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
      - name: Self-remove helper and commit
        run: |
          git rm .github/workflows/epic40-test-guard-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add platform/tests/test_control_knowledge.py
          git commit -m "test(svp2-e02): assert absence of PASS projection state"
          git push origin HEAD:feat/svp2-e02-nist-control-knowledge-layer
