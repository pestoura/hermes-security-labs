name: svp2-b03-controlled-docker-evidence

on:
  pull_request:
    paths:
      - 'platform/lab-lifecycle/**'
      - 'platform/tests/test_controlled_docker_lab_lifecycle.py'
      - '.github/workflows/svp2-b03-controlled-docker-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: svp2-b03-controlled-docker-evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  controlled-docker-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Require real Docker daemon
        run: docker info
      - name: Install bounded test dependencies
        run: python -m pip install --disable-pip-version-check pytest jsonschema
      - name: Execute real controlled Docker lifecycle evidence
        run: python -m pytest platform/tests/test_controlled_docker_lab_lifecycle.py -q -ra
