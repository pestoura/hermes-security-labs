name: Apply EPIC-05 API candidate patch once

on:
  push:
    branches:
      - feat/epic-05-api-adapter-candidate

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/epic-05-api-adapter-candidate
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply exact API candidate patch
        run: python tools/tmp_epic05_api_candidate_patch.py
      - name: Install validation dependencies and SDK
        run: python -m pip install --disable-pip-version-check -q pytest ruff -e platform/runner-protocol
      - name: Validate API candidate boundary and conformance
        run: |
          python platform/runner-protocol/validate_protocol.py --contract-only
          python platform/runner-protocol/conformance.py \
            --command "python security/packs/api/src/api_pentest_runbooks/runner_protocol_adapter.py --conformance-only" \
            --adapter-id api-runner-candidate \
            --output /tmp/api-runner-candidate-conformance.json
          python -m pytest -q platform/runner-protocol/tests security/packs/api/tests roadmap/tests docs/tests -p no:cacheprovider
          ruff check --config security/pyproject.toml platform/runner-protocol security/packs/api docs/tests roadmap/tests
          git diff --check
      - name: Commit validated API candidate integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(epic-05): integrate API conformance-only candidate"
          git push origin HEAD:feat/epic-05-api-adapter-candidate
