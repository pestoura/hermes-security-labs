name: Record EPIC-05 conformance as-built once

on:
  push:
    branches:
      - docs/epic-05-conformance-as-built

permissions:
  contents: write

jobs:
  record:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/epic-05-conformance-as-built
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply exact lifecycle patch
        run: python tools/tmp_epic05_conformance_as_built.py
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -q pytest pyyaml jsonschema ruff
      - name: Validate lifecycle record
        run: |
          python platform/runner-protocol/validate_protocol.py --contract-only
          python platform/runner-protocol/conformance.py --self-test
          python -m pytest -q platform/runner-protocol/tests roadmap/tests docs/tests -p no:cacheprovider
          ruff check --config security/pyproject.toml platform/runner-protocol docs/tests roadmap/tests
          git diff --check
      - name: Commit as-built record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(epic-05): record conformance kit as-built"
          git push origin HEAD:docs/epic-05-conformance-as-built
