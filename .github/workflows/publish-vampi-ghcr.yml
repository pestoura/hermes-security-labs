name: Publish VAmPI to GHCR

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the immutable VAmPI pilot image
        required: true
        type: boolean
        default: false

concurrency:
  group: ghcr-vampi-publish
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/hermes-vampi
  UPSTREAM_REPOSITORY: https://github.com/erev0s/VAmPI
  UPSTREAM_COMMIT: f16052dce83f05847133ec98f01c5193a41de7d8
  UPSTREAM_SHORT: f16052d

jobs:
  publish:
    name: Build and publish immutable VAmPI image
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5
        with:
          driver: docker-container

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate immutable OCI metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=upstream-${{ env.UPSTREAM_SHORT }}
            type=sha,prefix=repo-,format=long
          labels: |
            org.opencontainers.image.title=Hermes VAmPI
            org.opencontainers.image.description=Immutable VAmPI laboratory image built for hermes-security-labs
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/tree/main/platform/environments/web-api/vampi
            org.opencontainers.image.version=upstream-${{ env.UPSTREAM_SHORT }}
            org.opencontainers.image.revision=${{ env.UPSTREAM_COMMIT }}
            io.hermes.upstream.repository=${{ env.UPSTREAM_REPOSITORY }}
            io.hermes.upstream.revision=${{ env.UPSTREAM_COMMIT }}

      - name: Build and push VAmPI
        id: push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: https://github.com/erev0s/VAmPI.git#f16052dce83f05847133ec98f01c5193a41de7d8
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=vampi-f16052d
          cache-to: type=gha,mode=max,scope=vampi-f16052d

      - name: Verify published digest
        shell: bash
        run: |
          set -euo pipefail

          digest='${{ steps.push.outputs.digest }}'
          test -n "$digest"
          [[ "$digest" == sha256:* ]]

          image_ref="${REGISTRY}/${IMAGE_NAME}@${digest}"
          docker buildx imagetools inspect "$image_ref"

          {
            echo '### VAmPI GHCR publication'
            echo
            echo "- Package: \`${REGISTRY}/${IMAGE_NAME}\`"
            echo "- Upstream commit: \`${UPSTREAM_COMMIT}\`"
            echo "- Immutable reference: \`${image_ref}\`"
            echo "- Platform: \`linux/amd64\`"
            echo '- BuildKit provenance: `mode=max`'
            echo '- SBOM: enabled'
            echo '- Deployment: not performed'
          } >> "$GITHUB_STEP_SUMMARY"
