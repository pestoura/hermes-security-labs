name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    name: Documentation, catalogs and source-of-truth contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            platform/runner-protocol/pyproject.toml
            security/pyproject.toml
      - name: Install validation dependencies and Runner Protocol SDK
        run: |
          python -m pip install --disable-pip-version-check \
            pytest 'cryptography>=44,<49' -e platform/runner-protocol
      - name: Parse YAML files
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          count = 0
          for pattern in ('*.yaml', '*.yml'):
              for path in Path('.').rglob(pattern):
                  if '.git/' in path.as_posix():
                      continue
                  yaml.safe_load(path.read_text(encoding='utf-8'))
                  count += 1
          assert count > 0, 'no YAML documents were parsed'
          print(f'YAML_OK files={count}')
          PY
      - name: Validate documentation, links and Mermaid diagrams
        run: python -m pytest -q docs/tests -p no:cacheprovider
      - name: Validate environment catalog
        run: python platform/scripts/labctl.py validate
      - name: Audit environment maturity against the recorded baseline
        run: |
          set -euo pipefail
          python platform/scripts/lab_audit.py audit --strict
          python platform/scripts/lab_audit.py baseline-check
      - name: Validate runtime source of truth
        run: python platform/scripts/validate_source_of_truth.py validate
      - name: Test runtime source-of-truth contract
        run: python -m pytest -q platform/tests -p no:cacheprovider
      - name: Validate rollout plan
        run: python platform/scripts/labctl.py plan >/tmp/lab-rollout.tsv
      - name: Check shell syntax
        run: |
          find . -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
      - name: Test roadmap backlog integrity
        run: python -m pytest -q roadmap/tests -p no:cacheprovider
      - name: Validate concept epic catalogue against its schema
        run: |
          python - <<'PY'
          import json
          import jsonschema
          import yaml
          data = yaml.safe_load(open('roadmap/epics/security-validation-platform-v2-concepts.yaml', encoding='utf-8'))
          schema = json.load(open('schemas/concept-epic.schema.json', encoding='utf-8'))
          jsonschema.validate(data, schema)
          assert len(data['concept_epics']) == 45
          print('CONCEPT_CATALOGUE_OK')
          PY
      - name: Test deployment tracking tooling
        run: python -m pytest -q deployment/tests -p no:cacheprovider
      - name: Validate deployment tracking CLI help
        run: python deployment/deployment_tracking.py --help >/dev/null

  runner-protocol:
    name: Runner Protocol v2 SDK, contract and conformance kit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            platform/runner-protocol/pyproject.toml
            security/pyproject.toml
      - name: Install validation dependencies and Runner Protocol SDK
        run: |
          python -m pip install --disable-pip-version-check \
            pytest 'cryptography>=44,<49' -e platform/runner-protocol
      - name: Validate Runner Protocol v2 SDK, contract and conformance kit
        run: |
          set -euo pipefail
          durable_dir=$(mktemp -d)
          trap 'rm -rf "$durable_dir"' EXIT
          python -c "import runner_protocol_v2; assert runner_protocol_v2.__version__ == '2.0.0'"
          python platform/runner-protocol/validate_protocol.py --contract-only
          python platform/runner-protocol/conformance.py --self-test
          python platform/runner-protocol/conformance.py \
            --command "python security/packs/api/src/api_pentest_runbooks/runner_protocol_adapter.py --conformance-only" \
            --adapter-id api-runner-candidate \
            --output /tmp/api-runner-candidate-conformance.json
          python platform/runner-protocol/conformance.py \
            --command "python security/packs/api/src/api_pentest_runbooks/durable_runner_protocol_adapter.py --conformance-only --durable-ledger $durable_dir/api-runner-durable.sqlite3" \
            --adapter-id api-runner-durable-candidate \
            --output /tmp/api-runner-durable-candidate-conformance.json
          python -m pytest -q platform/runner-protocol/tests -p no:cacheprovider

  runtime:
    name: Compose, lifecycle and Phase 2 runtime gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            platform/runner-protocol/pyproject.toml
            security/pyproject.toml
      - name: Install validation dependencies and Runner Protocol SDK
        run: |
          python -m pip install --disable-pip-version-check \
            pytest 'cryptography>=44,<49' -e platform/runner-protocol
      - name: Validate Phase 2 lifecycle race handling
        run: bash platform/scripts/phase2-compose-lifecycle-self-test.sh
      - name: Validate WrongSecrets lifecycle and sanitized Challenge 3 harness
        run: bash platform/environments/devsecops/wrongsecrets/scripts/lifecycle-self-test.sh
      - name: Validate Phase 2 source archive safety
        run: python platform/runtime/phase2-safe-lab/fetch_source.py --self-test
      - name: Validate Phase 2 Compose generation
        run: python platform/scripts/phase2_compose.py --self-test
      - name: Exercise Phase 2 proxy liveness and forwarding
        run: |
          set -euo pipefail
          network=phase2-proxy-selftest
          target=phase2-proxy-selftest-target
          proxy=phase2-proxy-selftest-proxy
          python_image=docker.io/library/python:3.12-alpine3.22@sha256:a190708a2dec1bd18b1decb539f8e8f5407abaa9bf39cacda583f7f8c11db322
          proxy_image=docker.io/alpine/socat@sha256:7955a82d66fd43c711946ba5c499e3ec8bf494db8ce6b32ad4df5e1b13b8f1d2
          cleanup() {
            docker rm -f "$proxy" "$target" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker network create "$network" >/dev/null
          docker run -d --name "$target" --network "$network" \
            --entrypoint python "$python_image" \
            -m http.server 8080 --bind 0.0.0.0 >/dev/null
          docker run -d --name "$proxy" --network "$network" \
            --entrypoint socat "$proxy_image" \
            TCP-LISTEN:8080,reuseaddr,fork TCP:"$target":8080 >/dev/null
          docker exec "$proxy" /bin/sh -c 'kill -0 1'
          echo PHASE2_PROXY_LIVENESS_OK
          for _ in $(seq 1 20); do
            if docker run --rm --network "$network" --entrypoint python "$python_image" \
              -c "import urllib.request; urllib.request.urlopen('http://${proxy}:8080/', timeout=3).read(1)"; then
              echo PHASE2_PROXY_FORWARDING_OK
              exit 0
            fi
            sleep 1
          done
          docker logs "$proxy" --tail 50 || true
          exit 1
      - name: Validate Kali MCP Compose
        run: docker compose -f kali-mcp/compose.yaml config --quiet
      - name: Validate Juice Shop Compose
        run: docker compose -f platform/environments/web-api/juice-shop/compose.yaml config --quiet

  security:
    name: Security catalog, packs and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            platform/runner-protocol/pyproject.toml
            security/pyproject.toml
      - name: Install security validation dependencies and Runner Protocol SDK
        run: |
          python -m pip install --disable-pip-version-check \
            pytest ruff 'cryptography>=44,<49' -e platform/runner-protocol
      - name: Validate combined security catalog and platform bindings
        run: python security/tools/securityctl.py validate
      - name: Build disposable combined catalog
        run: python security/tools/securityctl.py catalog --output /tmp/security-catalog.json
      - name: Test common core
        run: PYTHONPATH=security/core/src pytest -q security/core/tests
      - name: Test API pack
        run: PYTHONPATH=security/packs/api/src pytest -q security/packs/api/tests
      - name: Test DevSecOps pack
        run: pytest -q security/packs/devsecops/tests
      - name: Test AI/MCP pack
        run: pytest -q security/packs/ai-mcp/tests
      - name: Test monorepo integration
        run: pytest -q security/tests
      - name: Lint security Python
        run: |
          ruff check --config security/pyproject.toml \
            security/core/src security/core/tests \
            security/packs/api/src security/packs/api/tests \
            security/packs/devsecops/tools security/packs/devsecops/tests \
            security/packs/ai-mcp/tools security/packs/ai-mcp/tests \
            security/tools security/tests \
            docs/tests \
            deployment \
            platform/scripts/validate_source_of_truth.py \
            platform/tests \
            platform/runner-protocol

  evidence:
    name: Exact-SHA validation evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [contracts, runner-protocol, runtime, security]
    if: ${{ always() }}
    steps:
      - name: Record exact-SHA gate outcome
        shell: bash
        env:
          CONTRACTS: ${{ needs.contracts.result }}
          RUNNER_PROTOCOL: ${{ needs['runner-protocol'].result }}
          RUNTIME: ${{ needs.runtime.result }}
          SECURITY: ${{ needs.security.result }}
        run: |
          set -euo pipefail
          {
            echo '### validate gate evidence'
            echo
            echo "- Repository: \`${GITHUB_REPOSITORY}\`"
            echo "- Event: \`${GITHUB_EVENT_NAME}\`"
            echo "- Ref: \`${GITHUB_REF}\`"
            echo "- Exact commit SHA: \`${GITHUB_SHA}\`"
            echo "- contracts: \`${CONTRACTS}\`"
            echo "- runner-protocol: \`${RUNNER_PROTOCOL}\`"
            echo "- runtime: \`${RUNTIME}\`"
            echo "- security: \`${SECURITY}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          for result in "$CONTRACTS" "$RUNNER_PROTOCOL" "$RUNTIME" "$SECURITY"; do
            if [[ "$result" != "success" ]]; then
              echo "FAIL: a required validate job did not succeed" >&2
              exit 1
            fi
          done
