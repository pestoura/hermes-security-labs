name: e02-completion-patch

on:
  push:
    branches:
      - docs/svp2-e02-completion

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/svp2-e02-completion
          fetch-depth: 0
      - name: Apply exact E-02 backlog and lifecycle reconciliation
        run: |
          python - <<'PY'
          from pathlib import Path

          backlog = Path('roadmap/epics/security-validation-platform-v2.yaml')
          text = backlog.read_text(encoding='utf-8')
          start = text.index('  - id: SVP2-E-02\n')
          end = text.index('\n  - id: SVP2-F-01\n', start)
          block = text[start:end]
          assert block.count('status: implementing') == 1, block
          assert block.count('"status:implementing"') == 1, block
          assert 'docs/roadmap/SVP2-E-02-completion-as-built.md' not in block
          assert block.count('      - docs/architecture/security-knowledge-fabric.md') == 1, block
          block = block.replace('    status: implementing\n', '    status: completed\n', 1)
          block = block.replace('"status:implementing"', '"status:completed"', 1)
          block = block.replace(
              '      - docs/architecture/security-knowledge-fabric.md',
              '      - docs/architecture/security-knowledge-fabric.md\n'
              '      - docs/roadmap/SVP2-E-02-completion-as-built.md',
              1,
          )
          backlog.write_text(text[:start] + block + text[end:], encoding='utf-8')

          guard = Path('roadmap/tests/test_svp2_final_delivery_status.py')
          g = guard.read_text(encoding='utf-8')
          completed_old = '    "SVP2-D-01", "SVP2-E-01", "SVP2-J-01",\n'
          completed_new = '    "SVP2-D-01", "SVP2-E-01", "SVP2-E-02", "SVP2-J-01",\n'
          assert g.count(completed_old) == 1
          assert g.count('    "SVP2-E-02",\n') == 1
          assert g.count('"SVP2-C-02", "SVP2-D-02", "SVP2-E-02",\n') == 1
          g = g.replace(completed_old, completed_new, 1)
          g = g.replace('    "SVP2-E-02",\n', '', 1)
          g = g.replace(
              '"SVP2-C-02", "SVP2-D-02", "SVP2-E-02",\n',
              '"SVP2-C-02", "SVP2-D-02",\n',
              1,
          )
          guard.write_text(g, encoding='utf-8')
          PY
          rm .github/workflows/e02-completion-patch.yml
          git diff --check
          if git diff --quiet -- . ':!.github/workflows/e02-completion-patch.yml'; then
            echo 'Expected E-02 reconciliation changes not found' >&2
            exit 1
          fi
      - name: Commit guarded patch and self-removal
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add roadmap/epics/security-validation-platform-v2.yaml roadmap/tests/test_svp2_final_delivery_status.py .github/workflows/e02-completion-patch.yml
          git commit -m 'docs(e02): promote delivery backlog status'
          git push origin HEAD:docs/svp2-e02-completion
