name: issue10-kind-runtime

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/issue10-kind-runtime.yml'
      - 'platform/environments/kubernetes/kind-rbac-synthetic/**'
      - 'platform/runtimes/kubernetes.yaml'
  pull_request:
    paths:
      - '.github/workflows/issue10-kind-runtime.yml'
      - 'platform/environments/kubernetes/kind-rbac-synthetic/**'
      - 'platform/runtimes/kubernetes.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue10-kind-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  controlled-kind-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLUSTER: hex0r-issue10
      NETWORK: hex0r-kind-issue10
      KUBECONFIG: /tmp/hex0r-issue10.kubeconfig
      KIND_VERSION: v0.32.0
      KIND_SHA256: 50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54
      NODE_IMAGE: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned kind binary
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/kind https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64
          echo "${KIND_SHA256}  /tmp/kind" | sha256sum -c -
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          kind version
          kubectl version --client

      - name: Create dedicated kind cluster and kubeconfig
        run: |
          set -euo pipefail
          docker network create --label hex0r.controlled-ci=issue10 "$NETWORK"
          export KIND_EXPERIMENTAL_DOCKER_NETWORK="$NETWORK"
          kind create cluster \
            --name "$CLUSTER" \
            --image "$NODE_IMAGE" \
            --kubeconfig "$KUBECONFIG" \
            --wait 180s
          test -s "$KUBECONFIG"
          chmod 0600 "$KUBECONFIG"
          kubectl --kubeconfig "$KUBECONFIG" get nodes -o name | grep -F "node/${CLUSTER}-control-plane"

      - name: Apply and verify bounded vulnerable RBAC fixture
        run: |
          set -euo pipefail
          kubectl --kubeconfig "$KUBECONFIG" apply -f platform/environments/kubernetes/kind-rbac-synthetic/lab.yaml
          test "$(kubectl --kubeconfig "$KUBECONFIG" auth can-i list secrets \
            --as=system:serviceaccount:hex0r-rbac-lab:lab-reader \
            --namespace=hex0r-rbac-lab)" = yes
          test "$(kubectl --kubeconfig "$KUBECONFIG" get secret synthetic-application-secret \
            -n hex0r-rbac-lab -o jsonpath='{.metadata.name}')" = synthetic-application-secret
          kubectl --kubeconfig "$KUBECONFIG" get networkpolicy default-deny-egress -n hex0r-rbac-lab >/dev/null

      - name: Prove reset by namespace recreation
        run: |
          set -euo pipefail
          kubectl --kubeconfig "$KUBECONFIG" delete namespace hex0r-rbac-lab --wait=true --timeout=120s
          if kubectl --kubeconfig "$KUBECONFIG" get namespace hex0r-rbac-lab >/dev/null 2>&1; then
            echo 'namespace residue remains after reset' >&2
            exit 1
          fi
          kubectl --kubeconfig "$KUBECONFIG" apply -f platform/environments/kubernetes/kind-rbac-synthetic/lab.yaml
          test "$(kubectl --kubeconfig "$KUBECONFIG" auth can-i get secrets \
            --as=system:serviceaccount:hex0r-rbac-lab:lab-reader \
            --namespace=hex0r-rbac-lab)" = yes

      - name: Attach and remove Kali only during validation window
        run: |
          set -euo pipefail
          docker build -t hermes/kali-mcp:issue10 kali-mcp
          docker run -d --name hex0r-issue10-kali --network "$NETWORK" \
            --read-only --cap-drop=ALL --security-opt no-new-privileges \
            --pids-limit 64 --memory 512m --cpus 0.5 \
            --tmpfs /run:size=64m --tmpfs /tmp:size=128m \
            --entrypoint /bin/sh hermes/kali-mcp:issue10 -c 'sleep 30'
          docker inspect hex0r-issue10-kali --format '{{json .NetworkSettings.Networks}}' | grep -F "$NETWORK"
          docker rm -f hex0r-issue10-kali >/dev/null
          if docker ps -a --filter name=hex0r-issue10-kali --format '{{.ID}}' | grep -q .; then
            echo 'Kali attachment residue detected' >&2
            exit 1
          fi

      - name: Destroy cluster and prove zero residue
        if: always()
        run: |
          set -euo pipefail
          export KIND_EXPERIMENTAL_DOCKER_NETWORK="$NETWORK"
          kind delete cluster --name "$CLUSTER" || true
          rm -f "$KUBECONFIG"
          docker rm -f hex0r-issue10-kali >/dev/null 2>&1 || true
          docker network rm "$NETWORK" >/dev/null 2>&1 || true
          if docker ps -a --filter name="${CLUSTER}-" --format '{{.ID}}' | grep -q .; then
            echo 'kind node residue detected' >&2
            exit 1
          fi
          if docker network ls --filter label=hex0r.controlled-ci=issue10 --format '{{.ID}}' | grep -q .; then
            echo 'kind network residue detected' >&2
            exit 1
          fi
          test ! -e "$KUBECONFIG"
