name: Materialize consolidated security platform

on:
  push:
    branches:
      - feat/consolidate-security-platform
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      CORE_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-9240-81f4-b1ae-67cc6d07759a/raw?se=2026-08-03T02:21:15Z&sp=r&sv=2026-02-06&sr=b&scid=8203d30e-cd7d-564c-8e71-f251ff71aed4&skoid=002823aa-689d-47ca-9347-108c20f4f00d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-02T21:56:21Z&ske=2026-08-03T21:56:21Z&sks=b&skv=2026-02-06&sig=fnLADXINyujdVXp//smDx8/zrJYlCbbhNWsV1MXpesw%3D'
      API_URL: 'https://sdmntprukwest.oaiusercontent.com/files/00000000-190c-8243-8145-f37b0c1d56a2/raw?se=2026-08-03T02:21:21Z&sp=r&sv=2026-02-06&sr=b&scid=edd78c6c-3d7f-5a72-a2ec-fbdf000982dc&skoid=002823aa-689d-47ca-9347-108c20f4f00d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-02T21:58:15Z&ske=2026-08-03T21:58:15Z&sks=b&skv=2026-02-06&sig=3v52Rhm0jeLnomCxKjsSKCTX6tpvg12aAKBRsxI7fzI%3D'
      DEVSECOPS_URL: 'https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-eedc-820a-9e01-b0a99af0df07/raw?se=2026-08-03T02:21:27Z&sp=r&sv=2026-02-06&sr=b&scid=648f9bc3-37db-5897-a5e3-e8639036072b&skoid=002823aa-689d-47ca-9347-108c20f4f00d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-02T21:48:59Z&ske=2026-08-03T21:48:59Z&sks=b&skv=2026-02-06&sig=bSOtWw86r6gNkG3R1Yrfw1qNNPNRCzEGx9796QhkH4A%3D'
      AIMCP_URL: 'https://sdmntprukwest.oaiusercontent.com/files/00000000-5b90-8243-9404-029d381a117f/raw?se=2026-08-03T02:21:34Z&sp=r&sv=2026-02-06&sr=b&scid=95566171-032b-545c-96a6-cd059baad03a&skoid=002823aa-689d-47ca-9347-108c20f4f00d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-02T21:52:44Z&ske=2026-08-03T21:52:44Z&sks=b&skv=2026-02-06&sig=sIcKDeYviVR61YA/fanVuT9WthXtbIlHRhuyNDH057I%3D'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/consolidate-security-platform
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and verify source exports
        run: |
          set -euo pipefail
          mkdir -p /tmp/security-import/artifacts
          curl --fail --location --retry 3 "$CORE_URL" -o /tmp/security-import/artifacts/core.zip
          curl --fail --location --retry 3 "$API_URL" -o /tmp/security-import/artifacts/api.zip
          curl --fail --location --retry 3 "$DEVSECOPS_URL" -o /tmp/security-import/artifacts/devsecops.zip
          curl --fail --location --retry 3 "$AIMCP_URL" -o /tmp/security-import/artifacts/ai-mcp.zip
          cat > /tmp/security-import/artifacts/SHA256SUMS <<'EOF'
          f9611ec10c957231a4955c8067638a1be8f92e5f8173ac12839fc21d28e5bd26  /tmp/security-import/artifacts/core.zip
          7f8676429a313e11216441d20bd55806b625157d91d32a6a6b6bf154fcacd13e  /tmp/security-import/artifacts/api.zip
          62de6cea5169990e209c10e3f263b4238cd517f54310006bb324387951e3f800  /tmp/security-import/artifacts/devsecops.zip
          63606ae2b2ce73cb93fbe8766e6fd6a3b5f7d204de9a72e9edbcb3ed9d00f5f9  /tmp/security-import/artifacts/ai-mcp.zip
          EOF
          sha256sum --check /tmp/security-import/artifacts/SHA256SUMS
      - name: Extract verified repository snapshots
        run: |
          set -euo pipefail
          for name in core api devsecops ai-mcp; do
            mkdir -p "/tmp/security-import/$name-artifact"
            unzip -q "/tmp/security-import/artifacts/$name.zip" -d "/tmp/security-import/$name-artifact"
          done
          (cd /tmp/security-import/core-artifact && sha256sum --check security-runbook-core.tar.gz.sha256)
          (cd /tmp/security-import/api-artifact && sha256sum --check api-pentest-runbooks.tar.gz.sha256)
          (cd /tmp/security-import/devsecops-artifact && sha256sum --check devsecops-security-runbooks.tar.gz.sha256)
          (cd /tmp/security-import/ai-mcp-artifact && sha256sum --check ai-mcp-security-runbooks.tar.gz.sha256)
          mkdir -p /tmp/security-import/unpacked
          tar -xzf /tmp/security-import/core-artifact/security-runbook-core.tar.gz -C /tmp/security-import/unpacked
          tar -xzf /tmp/security-import/api-artifact/api-pentest-runbooks.tar.gz -C /tmp/security-import/unpacked
          tar -xzf /tmp/security-import/devsecops-artifact/devsecops-security-runbooks.tar.gz -C /tmp/security-import/unpacked
          tar -xzf /tmp/security-import/ai-mcp-artifact/ai-mcp-security-runbooks.tar.gz -C /tmp/security-import/unpacked
      - name: Assemble platform and security boundaries
        run: |
          set -euo pipefail
          core=/tmp/security-import/unpacked/tmp/export/core
          api=/tmp/security-import/unpacked/tmp/export/api
          dev=/tmp/security-import/unpacked/tmp/export/devsecops
          ai=/tmp/security-import/unpacked/tmp/export/ai-mcp

          rm -rf security .migration
          mkdir -p security/core security/packs/api security/packs/devsecops security/packs/ai-mcp

          rsync -a --exclude='.github/' --exclude='.gitignore' --exclude='.pytest_cache/' "$core/" security/core/

          python -m pip install --disable-pip-version-check PyYAML jsonschema pytest ruff
          PYTHONPATH="$api/src" python "$api/tools/materialize.py" --root "$api" --output dist/runbooks
          rsync -a \
            --exclude='.github/' --exclude='.gitignore' --exclude='.pytest_cache/' \
            --exclude='integrations/hermes-security-labs.yaml' \
            --exclude='runbooks/catalog.csv.gz' \
            "$api/" security/packs/api/
          rm -rf security/packs/api/runbooks security/packs/api/dist
          mkdir -p security/packs/api/runbooks
          rsync -a "$api/dist/runbooks/" security/packs/api/runbooks/

          rsync -a \
            --exclude='.github/' --exclude='.gitignore' --exclude='.pytest_cache/' \
            --exclude='labs/hermes-security-labs.yaml' \
            "$dev/" security/packs/devsecops/
          rsync -a \
            --exclude='.github/' --exclude='.gitignore' --exclude='.pytest_cache/' \
            --exclude='labs/hermes-security-labs.yaml' \
            "$ai/" security/packs/ai-mcp/
          find security -type d -empty -delete || true
      - name: Validate imported components
        run: |
          set -euo pipefail
          test "$(find security/packs/api/runbooks -type f -name '*.yaml' | wc -l)" -eq 150
          test "$(find security/packs/devsecops/runbooks -type f -name '*.yaml' | wc -l)" -eq 120
          test "$(find security/packs/ai-mcp/runbooks -type f -name '*.yaml' | wc -l)" -eq 100
          PYTHONPATH=security/core/src pytest -q security/core/tests
          PYTHONPATH=security/packs/api/src pytest -q security/packs/api/tests
          PYTHONPATH=security/packs/devsecops pytest -q security/packs/devsecops/tests
          PYTHONPATH=security/packs/ai-mcp pytest -q security/packs/ai-mcp/tests
          ruff check security/core/src security/core/tests \
            security/packs/api/src security/packs/api/runner security/packs/api/tests \
            security/packs/devsecops/tools security/packs/devsecops/runner security/packs/devsecops/tests \
            security/packs/ai-mcp/tools security/packs/ai-mcp/runner security/packs/ai-mcp/tests
      - name: Commit consolidated security source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No generated changes'
            exit 0
          fi
          git commit -m 'feat: consolidate security testing source'
          git push origin HEAD:feat/consolidate-security-platform
