name: epic45-query-hardening

on:
  push:
    branches:
      - feat/svp2-e02-operational-query-contract

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/svp2-e02-operational-query-contract
          fetch-depth: 0

      - name: Apply fail-closed query access hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("platform/knowledge-api/operational_query.py")
          text = path.read_text(encoding="utf-8")

          old = '''    mode = QUESTION_CATALOGUE[validated_query["question_id"]]["scope_mode"]
    access_decision = "ALLOW"
    if mode == "UNSCOPED_KNOWLEDGE" and not policy["allow_unscoped_knowledge"]:
        access_decision = "DENY"
    elif mode == "ASSET" and not policy["allowed_asset_ids"]:
        access_decision = "DENY"
    elif mode == "CAMPAIGN" and not policy["allowed_campaign_ids"]:
        access_decision = "DENY"
'''
          new = '''    mode = QUESTION_CATALOGUE[validated_query["question_id"]]["scope_mode"]
    access_decision = "ALLOW"
    if not required_kinds.issubset(set(policy["allowed_index_kinds"])):
        access_decision = "DENY"
    elif mode == "UNSCOPED_KNOWLEDGE" and not policy["allow_unscoped_knowledge"]:
        access_decision = "DENY"
    elif mode == "ASSET" and not policy["allowed_asset_ids"]:
        access_decision = "DENY"
    elif mode == "CAMPAIGN" and not policy["allowed_campaign_ids"]:
        access_decision = "DENY"
'''
          if text.count(old) != 1:
              raise SystemExit("access-decision patch target must exist exactly once")
          text = text.replace(old, new, 1)

          old_limit = '''            "QUERY_RESULT_DOES_NOT_ESTABLISH_CONTROL_EFFECTIVENESS_OR_COMPLIANCE",
'''
          new_limit = '''            "QUERY_RESULT_DOES_NOT_ESTABLISH_CONTROL_EFFECTIVENESS_OR_COMPLIANCE",
            "NEGATIVE_RESULTS_ARE_LIMITED_TO_THE_SUPPLIED_AUTHORIZED_INDEX_SCOPE",
'''
          if text.count(old_limit) != 1:
              raise SystemExit("limitations patch target must exist exactly once")
          path.write_text(text.replace(old_limit, new_limit, 1), encoding="utf-8")
          PY
          git diff --check

      - name: Commit hardening and remove helper
        shell: bash
        run: |
          git rm .github/workflows/epic45-query-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform/knowledge-api/operational_query.py
          git commit -m "fix(svp2-e02): fail closed on incomplete query access scope"
          git push origin HEAD:feat/svp2-e02-operational-query-contract
