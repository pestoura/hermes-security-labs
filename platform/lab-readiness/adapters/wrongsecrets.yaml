schema_version: 1
env_id: wrongsecrets
# Liveness answers "is the runtime object there?"; readiness answers "does the lab
# actually serve what a consumer needs before authorised activity starts?".
# Probes are loopback-only and non-offensive: no challenge solving, no payloads.
liveness:
  - id: lifecycle-status
    kind: lifecycle_status
    timeout_seconds: 20
    description: Shipped status action for the wrongsecrets compose project.
readiness:
  - id: http-root
    kind: http_get
    url: http://127.0.0.1:8082/
    expect_status: 200
    timeout_seconds: 5
    description: WrongSecrets web UI answers 200 on the published loopback port.
