# Canonical target registry for Hermes Security Labs.
#
# Contract:
#   * target_id is the ONLY execution authority. A raw URL, hostname or IP
#     address never authorizes execution by itself.
#   * Offensive execution eligibility resolves TRUE only for authorization_state
#     LAB_ONLY or AUTHORIZED_TEST_TARGET. Every other state, and any unknown,
#     missing or ambiguous value, fails closed.
#   * Only internal (lab network) or loopback identities are represented. No
#     public or externally routable target is registered here.
#
# Populated exclusively from committed manifests/compose files of the executable
# Docker laboratories. Health is UNKNOWN by design: this registry is static and
# never observes runtime.
schema_version: "1.0"
contract:
  canonical_authority: target_id
  fail_closed: true
  offensive_execution_states:
    - LAB_ONLY
    - AUTHORIZED_TEST_TARGET

targets:
  - target_id: juice-shop-web
    environment_id: juice-shop
    kind: application
    description: OWASP Juice Shop web application (single service).
    identity:
      hostname: juice-shop
      port: 3000
      protocol: tcp
      scheme: http
      path: /
      network: juice-shop-lab
      reachability: lab-internal
    authorization_state: LAB_ONLY
    lifecycle: PROVISIONED
    health: UNKNOWN
    scope:
      allowed_operations:
        - discovery
        - service_enumeration
        - web_content_discovery
        - web_vulnerability_scan
        - manual_exploitation
      denied_operations:
        - egress-dependent testing
      notes: Manifest declares egress false; keep all traffic on juice-shop-lab.
    evidence:
      source: repository-manifest
      manifest_path: platform/environments/web-api/juice-shop/manifest.yaml
      compose_path: platform/environments/web-api/juice-shop/compose.yaml

