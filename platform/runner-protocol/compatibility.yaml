schema_version: "1.3"
protocol:
  name: runner-protocol
  version: "2.0.0"
  status: contract_only

compatibility_rules:
  major_version: exact_match
  unknown_major: fail_closed
  unknown_message_type: fail_closed
  invalid_schema: fail_closed
  progress_default: optional
  terminal_outcome: mandatory
  terminal_evidence_reference: mandatory
  authorization_source: hermes_control_plane

conformance_kit:
  status: available
  transport: json_lines
  execution_model: isolated_candidate_process
  reference_adapter: test_only
  report_schema: schemas/conformance-report.schema.json
  promotion_effect: none
  required_verdict_for_promotion: PASS

runner_families:
  - id: api
    implementation_status: candidate
    protocol_status: conformance_only
    conformance: PASS_SYNTHETIC
    execution_integration: NOT_RUN
    promotion_status: blocked
    supported_scope: synthetic_conformance_only
    activation: explicit_flag
    adapter_path: security/packs/api/src/api_pentest_runbooks/runner_protocol_adapter.py
    activation_argument: --conformance-only
    durable_idempotency:
      status: PASS_SYNTHETIC
      integration_scope: synthetic_conformance_only
      adapter_path: security/packs/api/src/api_pentest_runbooks/durable_runner_protocol_adapter.py
      activation_argument: --durable-ledger
      storage_requirement: absolute_path_outside_working_tree
      restart_replay: PASS_SYNTHETIC
      abandoned_claim_reclaim: blocked
      production_effect_claim: none
    supervised_process:
      status: PASS_SYNTHETIC_PROCESS
      integration_scope: fixed_synthetic_worker_only
      adapter_path: security/packs/api/src/api_pentest_runbooks/supervised_runner_protocol_adapter.py
      worker_path: security/packs/api/src/api_pentest_runbooks/synthetic_supervised_worker.py
      activation_arguments:
        - --conformance-only
        - --synthetic-process-only
        - --durable-ledger
      durable_claim_before_spawn: PASS_SYNTHETIC_PROCESS
      async_cancellation: PASS_SYNTHETIC_PROCESS
      hard_timeout: PASS_SYNTHETIC_PROCESS
      descendant_residue: fail_closed_inconclusive
      raw_output_persistence: none
      sandbox_status: NOT_IMPLEMENTED
      production_effect_claim: none
    notes: The opt-in API candidates prove synthetic protocol, durable restart replay and fixed-worker process supervision. They remain disconnected from execute_runbook and the legacy ProcessBridgeAdapter; no real API capability is integrated.
  - id: devsecops
    implementation_status: candidate
    protocol_status: conformance_only
    conformance: PASS_SYNTHETIC_PROCESS
    execution_integration: NOT_RUN
    promotion_status: blocked
    supported_scope: fixed_synthetic_worker_only
    activation: explicit_flag
    adapter_path: security/packs/devsecops/src/devsecops_runbooks/supervised_runner_protocol_adapter.py
    activation_argument: --conformance-only
    supervised_process:
      status: PASS_SYNTHETIC_PROCESS
      integration_scope: fixed_synthetic_worker_only
      adapter_path: security/packs/devsecops/src/devsecops_runbooks/supervised_runner_protocol_adapter.py
      worker_path: security/packs/devsecops/src/devsecops_runbooks/synthetic_supervised_worker.py
      activation_arguments:
        - --conformance-only
        - --synthetic-process-only
        - --durable-ledger
      durable_claim_before_spawn: PASS_SYNTHETIC_PROCESS
      async_cancellation: PASS_SYNTHETIC_PROCESS
      hard_timeout: PASS_SYNTHETIC_PROCESS
      descendant_residue: fail_closed_inconclusive
      raw_output_persistence: none
      sandbox_status: NOT_IMPLEMENTED
      production_effect_claim: none
    notes: The opt-in DevSecOps candidate proves fixed-worker synthetic process supervision through the shared SDK engine. It is not connected to real scanners, repositories, pipelines, networks, targets or legacy execution paths.
  - id: ai-mcp
    implementation_status: not_started
    protocol_status: contract_only
    conformance: NOT_RUN
    execution_integration: NOT_RUN
    promotion_status: blocked
    supported_scope: none
    activation: none
    adapter_path: null
    activation_argument: null
    notes: Existing AI/MCP pack semantics are unchanged; no Runner Protocol adapter exists.

migration_gates:
  - schema_validation
  - semantic_validation
  - correlation_propagation
  - idempotency_replay_test
  - cancellation_timeout_test
  - evidence_reference_test
  - secret_redaction_test
  - conformance_report_pass
  - human_review_before_promotion

runtime_declaration: NO_RUNTIME_CHANGE
