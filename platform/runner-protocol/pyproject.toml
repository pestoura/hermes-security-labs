[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "runner-protocol-v2"
version = "2.0.0"
description = "Repository-local SDK for the Security Validation Platform Runner Protocol v2"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23",
  "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["runner_protocol_v2*"]
