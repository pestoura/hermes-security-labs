id: rag-poisoning-lab
name: Synthetic RAG Poisoning Lab
description: Deterministic poisoned-document retrieval and context-trust exercises.
category: ai-mcp
runtime: docker
driver: docker-compose
risk: medium
source: https://github.com/pestoura/hermes-security-labs
version: synthetic-v1
host_port: 8216
resources:
  cpus: 0.5
  memory: 256m
  disk: 1G
networks:
- rag-poisoning-lab-internal
- rag-poisoning-lab-publication
egress: false
targets:
- http://target:8080/
- http://target:8090/mcp
attacker: kali-mcp
lifecycle:
- start
- status
- smoke
- stop
- reset
- destroy
reset: platform/scripts/phase2-compose-lab.sh rag-poisoning-lab reset
cleanup: platform/scripts/phase2-compose-lab.sh rag-poisoning-lab destroy
evidence: ${EVIDENCE_DIR:-.runtime/evidence/rag-poisoning-lab}
dependencies:
- docker
- docker-compose
- python3
- PyYAML
supported_tools:
- read_source
- analyze_source
- rag_query
limitations:
- synthetic local corpus
- no vector database
- no external embeddings or model API
- no real sensitive data
- target runtime egress denied by an internal Docker network
- localhost publication uses a separate secret-free proxy
- Kali attachment is temporary and must end disconnected
- effective Compose is deterministically generated from platform/phase2/environments.yaml
- Phase 2 local validation required before merge
status: CURRENT-LIMITED
