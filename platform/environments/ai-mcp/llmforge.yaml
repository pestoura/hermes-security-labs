id: llmforge
name: LLMForge Deterministic Local Lab
description: Deterministic local LLM vulnerability exercises based on an immutable LLMForge snapshot.
category: ai-mcp
runtime: docker
driver: docker-compose
risk: medium
source: https://github.com/SasanLabs/LLMForge
version: 62c756fc79343e4fbf2344eaf683e9a44e6ca5c3
host_port: 8212
resources:
  cpus: 1.0
  memory: 768m
  disk: 3G
networks:
- llmforge-internal
- llmforge-publication
egress: false
targets:
- http://target:8080/
- http://target:8090/mcp
attacker: kali-mcp
lifecycle:
- start
- status
- smoke
- stop
- reset
- destroy
reset: platform/scripts/phase2-compose-lab.sh llmforge reset
cleanup: platform/scripts/phase2-compose-lab.sh llmforge destroy
evidence: ${EVIDENCE_DIR:-.runtime/evidence/llmforge}
dependencies:
- docker
- docker-compose
- python3
- PyYAML
supported_tools:
- read_source
- analyze_source
- rag_query
limitations:
- no external model API
- no model credentials
- deterministic simulation
- no untrusted plugin execution
- target runtime egress denied by an internal Docker network
- localhost publication uses a separate secret-free proxy
- Kali attachment is temporary and must end disconnected
- effective Compose is deterministically generated from platform/phase2/environments.yaml
- Phase 2 local validation required before merge
status: CURRENT-LIMITED
