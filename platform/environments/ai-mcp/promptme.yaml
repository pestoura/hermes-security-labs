id: promptme
name: PromptMe Deterministic Local Lab
description: Deterministic local prompt-injection training profile based on an immutable PromptMe snapshot.
category: ai-mcp
runtime: docker
driver: docker-compose
risk: medium
source: https://github.com/R3dShad0w7/PromptMe
version: fd7676c323698e824f4417bd5d116c18baabe902
host_port: 8210
resources:
  cpus: 1.0
  memory: 768m
  disk: 3G
networks:
- promptme-internal
- promptme-publication
egress: false
targets:
- http://target:8080/
- http://target:8090/mcp
attacker: kali-mcp
lifecycle:
- start
- status
- smoke
- stop
- reset
- destroy
reset: platform/scripts/phase2-compose-lab.sh promptme reset
cleanup: platform/scripts/phase2-compose-lab.sh promptme destroy
evidence: ${EVIDENCE_DIR:-.runtime/evidence/promptme}
dependencies:
- docker
- docker-compose
- python3
- PyYAML
supported_tools:
- read_source
- analyze_source
limitations:
- no external model API
- no model credentials
- deterministic simulation rather than generative inference
- source snapshot is immutable
- target runtime egress denied by an internal Docker network
- localhost publication uses a separate secret-free proxy
- Kali attachment is temporary and must end disconnected
- effective Compose is deterministically generated from platform/phase2/environments.yaml
- Phase 2 local validation required before merge
status: CURRENT-LIMITED
