name: crapi

x-service-security: &service-security
  cap_drop:
    - NET_RAW
  security_opt:
    - no-new-privileges:true
  restart: on-failure

services:
  crapi-identity:
    <<: *service-security
    image: crapi/crapi-identity:1.1.6-rc8
    environment:
      LOG_LEVEL: INFO
      DB_NAME: crapi
      DB_USER: admin
      DB_PASSWORD: crapisecretpassword
      DB_HOST: postgresdb
      DB_PORT: "5432"
      SERVER_PORT: "8080"
      ENABLE_SHELL_INJECTION: "false"
      JWT_SECRET: crapi
      MAILHOG_HOST: mailhog
      MAILHOG_PORT: "1025"
      MAILHOG_DOMAIN: example.com
      SMTP_HOST: smtp.example.com
      SMTP_PORT: "587"
      SMTP_EMAIL: user@example.com
      SMTP_PASS: xxxxxxxxxxxxxx
      SMTP_FROM: no-reply@example.com
      SMTP_AUTH: "true"
      SMTP_STARTTLS: "true"
      JWT_EXPIRATION: "604800000"
      ENABLE_LOG4J: "false"
      API_GATEWAY_URL: https://api.mypremiumdealership.com
      TLS_ENABLED: "false"
    depends_on:
      postgresdb:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      mailhog:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/health.sh"]
      interval: 15s
      timeout: 15s
      retries: 20
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.60"
          memory: 384M
          pids: 120
    networks:
      crapi-core:
        aliases:
          - crapi-identity

  crapi-community:
    <<: *service-security
    image: crapi/crapi-community:1.1.6-rc8
    environment:
      LOG_LEVEL: INFO
      IDENTITY_SERVICE: crapi-identity:8080
      DB_NAME: crapi
      DB_USER: admin
      DB_PASSWORD: crapisecretpassword
      DB_HOST: postgresdb
      DB_PORT: "5432"
      SERVER_PORT: "8087"
      MONGO_DB_HOST: mongodb
      MONGO_DB_PORT: "27017"
      MONGO_DB_USER: admin
      MONGO_DB_PASSWORD: crapisecretpassword
      MONGO_DB_NAME: crapi
      TLS_ENABLED: "false"
    depends_on:
      postgresdb:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      crapi-identity:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/health.sh"]
      interval: 15s
      timeout: 15s
      retries: 20
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 192M
          pids: 100
    networks:
      crapi-core:
        aliases:
          - crapi-community

  crapi-workshop:
    <<: *service-security
    image: crapi/crapi-workshop:1.1.6-rc8
    environment:
      LOG_LEVEL: INFO
      IDENTITY_SERVICE: crapi-identity:8080
      DB_NAME: crapi
      DB_USER: admin
      DB_PASSWORD: crapisecretpassword
      DB_HOST: postgresdb
      DB_PORT: "5432"
      SERVER_PORT: "8000"
      MONGO_DB_HOST: mongodb
      MONGO_DB_PORT: "27017"
      MONGO_DB_USER: admin
      MONGO_DB_PASSWORD: crapisecretpassword
      MONGO_DB_NAME: crapi
      SECRET_KEY: crapi
      API_GATEWAY_URL: https://api.mypremiumdealership.com
      TLS_ENABLED: "false"
      FILES_LIMIT: "1000"
    depends_on:
      postgresdb:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      crapi-identity:
        condition: service_healthy
      crapi-community:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/health.sh"]
      interval: 15s
      timeout: 15s
      retries: 20
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 192M
          pids: 100
    networks:
      crapi-core:
        aliases:
          - crapi-workshop

  crapi-web:
    <<: *service-security
    image: crapi/crapi-web:1.1.6-rc8
    environment:
      COMMUNITY_SERVICE: crapi-community:8087
      IDENTITY_SERVICE: crapi-identity:8080
      WORKSHOP_SERVICE: crapi-workshop:8000
      MAILHOG_WEB_SERVICE: mailhog:8025
      TLS_ENABLED: "false"
    depends_on:
      crapi-community:
        condition: service_healthy
      crapi-identity:
        condition: service_healthy
      crapi-workshop:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:80/health >/dev/null"]
      interval: 15s
      timeout: 15s
      retries: 20
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 160M
          pids: 100
    networks:
      crapi-lab:
        aliases:
          - crapi
      crapi-core:
        aliases:
          - crapi-web
    ports:
      - "127.0.0.1:${CRAPI_HOST_PORT:-8888}:80"

  gateway:
    <<: *service-security
    image: crapi/gateway-service:1.1.6-rc8
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/443"]
      interval: 15s
      timeout: 15s
      retries: 20
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 64M
          pids: 80
    networks:
      crapi-core:
        aliases:
          - api.mypremiumdealership.com

  mailhog:
    <<: *service-security
    image: crapi/mailhog:1.1.6-rc8
    user: root
    environment:
      MH_MONGO_URI: admin:crapisecretpassword@mongodb:27017
      MH_STORAGE: mongodb
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8025"]
      interval: 15s
      timeout: 15s
      retries: 20
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 128M
          pids: 80
    networks:
      crapi-core:
        aliases:
          - mailhog

  postgresdb:
    <<: *service-security
    image: docker.io/library/postgres:14
    command: ["postgres", "-c", "max_connections=500"]
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: crapisecretpassword
      POSTGRES_DB: crapi
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d crapi"]
      interval: 15s
      timeout: 15s
      retries: 20
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: 384M
          pids: 120
    networks:
      crapi-core:
        aliases:
          - postgresdb
    volumes:
      - crapi-postgres-data:/var/lib/postgresql/data

  mongodb:
    <<: *service-security
    image: docker.io/library/mongo:4.4.29
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: crapisecretpassword
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongo --quiet --username admin --password crapisecretpassword
          --authenticationDatabase admin
          --eval 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 1)'
      interval: 15s
      timeout: 15s
      retries: 20
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.35"
          memory: 384M
          pids: 120
    networks:
      crapi-core:
        aliases:
          - mongodb
    volumes:
      - crapi-mongo-data:/data/db

networks:
  crapi-lab:
    name: crapi-lab
    driver: bridge
  crapi-core:
    name: crapi-core
    driver: bridge
    internal: true

volumes:
  crapi-postgres-data:
  crapi-mongo-data:
