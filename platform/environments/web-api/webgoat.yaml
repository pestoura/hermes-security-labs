id: webgoat
name: WebGoat
description: Deliberately insecure JVM web app for teaching web app security lessons.
runtime: docker
driver: docker-compose
risk: low
source: webgoat-community
version: 8.3.0
resources:
  cpu: '1.5'
  memory: 2Gi
  disk: 12Gi
networks:
- labnet-web
egress: false
targets:
- webgoat:8080
- webwolf:8080
attacker: kali
lifecycle:
- start
- stop
- reset
- destroy
reset: docker-compose restart webgoat
cleanup: docker-compose down -v
evidence: lesson completion records; WebWolf artifacts
dependencies:
- docker
supported_tools:
- burp
- owasp-zap
- postman
limitations:
- lesson mode not suitable for blind assessment
status: CURRENT
category: web-api
