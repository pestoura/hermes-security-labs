name: graphql-vulnerable-lab

services:
  graphql-vulnerable-lab:
    image: ghcr.io/pestoura/hermes-dvga@sha256:6e5fcb0bca47ac75fc218d2a62858673964d8703341bb6387841a84b7409d2d4
    environment:
      WEB_HOST: 0.0.0.0
      WEB_PORT: "5013"
    cap_drop:
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
          pids: 120
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:5013/', timeout=5).read(1)
      interval: 10s
      timeout: 8s
      retries: 18
      start_period: 30s
    networks:
      graphql-vulnerable-lab:
        aliases:
          - graphql-vulnerable-lab
    ports:
      - "127.0.0.1:${GRAPHQL_LAB_HOST_PORT:-5013}:5013"
    restart: on-failure

networks:
  graphql-vulnerable-lab:
    name: graphql-vulnerable-lab
    driver: bridge
