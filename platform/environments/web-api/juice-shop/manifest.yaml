id: juice-shop
name: OWASP Juice Shop
description: OWASP Juice Shop web lab.
category: web-api
runtime: docker
driver: docker-compose
risk: low
source: juice-shop
version: latest
resources:
  cpus: 1.0
  memory: 512M
  disk: 2G
networks:
  - juice-shop-lab
egress: false
targets:
  - juice-shop
attacker: kali-mcp
lifecycle:
  - start
  - status
  - smoke
  - stop
  - reset
  - destroy
reset: "./scripts/reset.sh"
cleanup: "./scripts/destroy.sh"
evidence: ${EVIDENCE_DIR:-runtime/evidence/juice-shop}
dependencies:
  - docker
supported_tools:
  - server_health
  - execute_command
  - nmap_scan
  - nikto_scan
  - gobuster_scan
  - dirb_scan
limitations:
  - local validation only
  - no external targets
  - no SQLMap, Hydra, Metasploit
status: CURRENT
