name: juice-shop
services:
  juice-shop:
    image: bkimminich/juice-shop@sha256:e68144772ebaaca0ec117b38d44903af92416793230288ef7c5437fc4f26850a
    container_name: juice-shop
    cap_drop:
      - all
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 100
    healthcheck:
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - "const http=require('http');const req=http.get('http://127.0.0.1:3000',(res)=>{const ok=res.statusCode>=200&&res.statusCode<500;res.resume();process.exit(ok?0:1);});req.on('error',()=>process.exit(1));req.setTimeout(3000,()=>{req.destroy();process.exit(1);});"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - juice-shop-lab
    ports:
      - "127.0.0.1:3000:3000"
    restart: on-failure
    security_opt:
      - no-new-privileges:true
    volumes:
      - juice-shop-data:/juice-shop/data
      - juice-shop-ftp:/juice-shop/ftp
networks:
  juice-shop-lab:
    driver: bridge
volumes:
  juice-shop-data:
  juice-shop-ftp:
