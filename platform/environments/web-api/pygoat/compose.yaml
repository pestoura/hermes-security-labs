name: pygoat

services:
  pygoat:
    image: ghcr.io/pestoura/hermes-pygoat@sha256:3df04f28225c1b9a7a888edbb724540364c3d88967578fc688d47632272069a9
    cap_drop:
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1G
          pids: 150
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5).read(1)
      interval: 10s
      timeout: 8s
      retries: 24
      start_period: 45s
    networks:
      pygoat-lab:
        aliases:
          - pygoat
    ports:
      - "127.0.0.1:${PYGOAT_HOST_PORT:-8000}:8000"
    restart: on-failure

networks:
  pygoat-lab:
    name: pygoat-lab
    driver: bridge
