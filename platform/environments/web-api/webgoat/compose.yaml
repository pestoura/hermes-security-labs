name: webgoat
services:
  webgoat:
    image: webgoat/webgoat@sha256:2775102b8186df1656f8a69cfb7a6bf6c77b43a25fa0accd6d44e6ae04c8d3b7
    cap_drop:
      - all
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
          pids: 100
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -c
        - |
          check_http() {
            local code
            code="$(
              curl \
                --silent \
                --show-error \
                --output /dev/null \
                --write-out '%{http_code}' \
                --max-time 5 \
                "$1"
            )" || return 1
            [[ "$${code}" =~ ^[234][0-9][0-9]$ ]]
          }
          check_http http://127.0.0.1:8080/WebGoat/ &&
          check_http http://127.0.0.1:9090/login
      interval: 15s
      timeout: 15s
      retries: 12
      start_period: 60s
    networks:
      - webgoat-lab
    restart: on-failure
    security_opt:
      - no-new-privileges:true
    volumes:
      - webgoat-data:/home/webgoat

  webgoat-proxy:
    image: docker.io/alpine/socat@sha256:7955a82d66fd43c711946ba5c499e3ec8bf494db8ce6b32ad4df5e1b13b8f1d2
    depends_on:
      webgoat:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        socat TCP-LISTEN:8080,reuseaddr,fork TCP:webgoat:8080 & p1=$$!
        socat TCP-LISTEN:9090,reuseaddr,fork TCP:webgoat:9090 & p2=$$!
        trap 'kill $$p1 $$p2 2>/dev/null || true' TERM INT
        wait $$p1
    cap_drop:
      - all
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
          pids: 32
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          socat -u /dev/null TCP:127.0.0.1:8080,connect-timeout=3 &&
          socat -u /dev/null TCP:127.0.0.1:9090,connect-timeout=3
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s
    networks:
      - webgoat-lab
      - webgoat-publish
    ports:
      - "127.0.0.1:${WEBGOAT_HOST_PORT:-8080}:8080"
      - "127.0.0.1:${WEBWOLF_HOST_PORT:-9090}:9090"
    read_only: true
    restart: on-failure
    security_opt:
      - no-new-privileges:true

networks:
  webgoat-lab:
    name: webgoat-lab
    driver: bridge
    internal: true
  webgoat-publish:
    name: webgoat-publish
    driver: bridge
    internal: false

volumes:
  webgoat-data:
