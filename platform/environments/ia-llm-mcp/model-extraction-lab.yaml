id: model-extraction-lab
name: Model Extraction Lab
description: Open weights model API with rate limits and watermarking metadata for
  extraction and replication attacks.
runtime: docker
driver: docker-compose
risk: medium
source: extraction-target
version: '1.0'
resources:
  cpu: '2'
  memory: 4Gi
  disk: 30Gi
networks:
- labnet-ia
egress: true
targets:
- model-api:8080
- prometheus:9090
attacker: kali-vm
lifecycle:
- start
- stop
- reset
