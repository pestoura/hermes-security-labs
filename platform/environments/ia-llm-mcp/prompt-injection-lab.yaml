id: prompt-injection-lab
name: Synthetic Prompt Injection Lab
description: Deterministic direct and indirect prompt-injection exercises.
category: ia-llm-mcp
runtime: docker
driver: docker-compose
risk: medium
source: https://github.com/pestoura/hermes-security-labs
version: synthetic-v1
host_port: 8214
resources:
  cpus: 0.5
  memory: 256m
  disk: 1G
networks:
- prompt-injection-lab-internal
- prompt-injection-lab-publication
egress: false
targets:
- http://target:8080/
- http://target:8090/mcp
attacker: kali-mcp
lifecycle:
- start
- status
- smoke
- stop
- reset
- destroy
reset: platform/scripts/phase2-compose-lab.sh prompt-injection-lab reset
cleanup: platform/scripts/phase2-compose-lab.sh prompt-injection-lab destroy
evidence: ${EVIDENCE_DIR:-.runtime/evidence/prompt-injection-lab}
dependencies:
- docker
- docker-compose
- python3
- PyYAML
supported_tools:
- read_source
- analyze_source
limitations:
- synthetic local corpus
- no external model API
- no real secrets
- training behavior is intentionally vulnerable
- target runtime egress denied by an internal Docker network
- localhost publication uses a separate secret-free proxy
- Kali attachment is temporary and must end disconnected
- effective Compose is deterministically generated from platform/phase2/environments.yaml
- Phase 2 local validation required before merge
status: CURRENT-LIMITED
